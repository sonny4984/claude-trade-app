 "They were last replaced more than twenty years ago.", "Most tenants prefer to use the stairs in the morning.", "Questions about the schedule may be directed to the management office at extension 204."], "a": 3, "n": "[문장삽입] also·They가 있는 선지가 1순위 후보 → also 선지는 '서쪽을 쓰라'와 모순, They는 앞 문장에 받아줄 복수 명사가 없음 → 마무리 문장(문의처).", "id": "t38-134", "w": "", "hit": false}]}, {"id": "t39-131", "kind": "notice", "tabs": [{"l": "notice", "h": "<h4>NOTICE TO MEMBERS<\/h4><p>To continue offering the highest standard of <b class=\"bl\">__131__<\/b> to our members, Brookside Fitness Center has scheduled the first-floor locker rooms for deep cleaning on Saturday, March 8, and Sunday, March 9. <b class=\"bl\">__132__<\/b> this period, the locker rooms will be closed, so members should use the showers and lockers on the second floor instead.<\/p><p>We <b class=\"bl\">__133__<\/b> for any inconvenience this may cause. <b class=\"bl\">__134__<\/b><\/p><p>Brookside Fitness Center Management<\/p>"}], "qs": [{"s": "빈칸 131", "o": ["cleanliness", "clean", "cleanly", "cleaned"], "a": 0, "n": "[파트5 유형: 문법] standard of + 명사.", "id": "t39-131", "w": "", "hit": false}, {"s": "빈칸 132", "o": ["Among", "During", "Without", "Between"], "a": 1, "n": "[전치사 통일 → 용법] this period(기간) 앞 → During.", "id": "t39-132", "w": "", "hit": false}, {"s": "빈칸 133", "o": ["organize", "recognize", "summarize", "apologize"], "a": 3, "n": "[어휘 = 해석] apologize for any inconvenience.", "id": "t39-133", "w": "", "hit": false}, {"s": "빈칸 134", "o": ["Please do not use the second-floor showers on these days.", "Questions or comments may be directed to the front desk.", "Thank you for your patience while the lobby is being repainted.", "If you would like to become a personal trainer, apply today."], "a": 1, "n": "[문장삽입] these·the가 있는 선지를 먼저 보되, '2층 샤워실을 쓰지 마라'는 지문(2층을 쓰라)과 모순, 로비 페인트칠은 지문에 없음 → 마무리(문의처). (T1-134)", "id": "t39-134", "w": "", "hit": false}]}, {"id": "t39-135", "kind": "customer review", "tabs": [{"l": "customer review", "h": "<p>My bicycle's rear wheel was damaged two days before a race, and I needed it repaired as <b class=\"bl\">__135__<\/b> as possible. A neighbor recommended Marlow Cycle Works on Canal Street. When I arrived, the owner, Ms. Marlow, looked at my bicycle right away <b class=\"bl\">__136__<\/b> several customers were waiting. She explained what was wrong, told me the full cost in advance, and promised to finish the work in two days. In fact, it was ready the next morning. <b class=\"bl\">__137__<\/b><\/p><p>Ms. Marlow has repaired bicycles for more than twenty years, and it shows. She is a <b class=\"bl\">__138__<\/b> mechanic. I recommend her shop to everyone.<\/p><p>Dev Anand, Bristol<\/p>"}], "qs": [{"s": "빈칸 135", "o": ["quicken", "quickest", "quickly", "quickness"], "a": 2, "n": "[문법] as + 부사 + as possible (repaired를 수식).", "id": "t39-135", "w": "", "hit": false}, {"s": "빈칸 136", "o": ["as far as", "such as", "even though", "whether"], "a": 2, "n": "[접속사 통일 → 해석] 손님이 기다리고 있었는데도 → even though.", "id": "t39-136", "w": "", "hit": false}, {"s": "빈칸 137", "o": ["Of course, the shop is closed on Mondays.", "The wheel has worked perfectly ever since.", "I bought the bicycle three years ago.", "She used to sell helmets as well."], "a": 1, "n": "[문장삽입] The wheel(정관사) → 앞의 rear wheel을 받음 + 수리 결과로 이어짐.", "id": "t39-137", "w": "", "hit": false}, {"s": "빈칸 138", "o": ["best", "former", "skilled", "temporary"], "a": 2, "n": "[어휘 + 수식어 순서] a + 형용사. 최상급 best는 the 필요. 칭찬 문맥이라 former·temporary 탈락. (T1-138)", "id": "t39-138", "w": "", "hit": false}]}], "p7s": [{"id": "t16-147", "kind": "notice", "tabs": [{"l": "notice", "h": "<h4>To All Tenants of the Halvorsen Building<\/h4><p>The building's main entrance on Lyle Street will be closed from 6:00 P.M. on Friday, June 6, until 6:00 A.M. on Monday, June 9, while the lobby floor is replaced. During this period, tenants should use the side entrance on Carver Avenue. Please note that a key card will be required to enter through the side door at all hours.<\/p><p>Tenants who are expecting deliveries over the weekend should ask couriers to call ahead, as no staff will be on duty at the front desk.<\/p><p>—Halvorsen Property Management<\/p>"}], "qs": [{"s": "What is the purpose of the notice?", "o": ["To announce new hours for the front desk", "To explain how to request a new key card", "To introduce a new delivery service", "To inform tenants about a temporary change in building access"], "a": 3, "n": "목적: 주말 동안 정문 폐쇄 + 옆문 이용 → 출입 방법의 일시적 변경. (B)는 key card 단어 재사용.", "id": "t16-147", "w": "", "hit": false}, {"s": "What is suggested about deliveries during the weekend?", "o": ["They will be left at the Carver Avenue entrance.", "They will be postponed until Monday.", "They must be signed for by building staff.", "No one will be available to receive them at the front desk."], "a": 3, "n": "추론: 'no staff will be on duty at the front desk' → 프런트에서 받아 줄 사람이 없음. (A)는 지문에 없는 연결, (C)는 정반대.", "id": "t16-148", "w": "no staff on duty → 받아줄 사람 없음 ← signed for by staff(반대) 선택 / 오답모음 재풀이 정답", "hit": true}]}, {"id": "t16-155", "kind": "e-mail", "tabs": [{"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> Marta Lindgren<\/div><div><b>From:<\/b> Owen Pryce<\/div><div><b>Date:<\/b> April 14<\/div><div><b>Subject:<\/b> Westbrook project<\/div><\/div><p>Hi Marta,<\/p><p>I've just returned from the Westbrook site. The concrete for the foundation was poured last Thursday, as planned, but the steel beams have not yet been delivered. — [1] —. The supplier told me that a machine at their factory broke down and that they will not be able to ship until April 28, two weeks later than scheduled.<\/p><p>This will push back the framing work, but I don't think the overall completion date needs to change. — [2] —. If we bring in a second crew for the framing, we should be able to make up most of the lost time. I've asked Hollis Construction whether they have a team available in early May. — [3] —.<\/p><p>Could you let the client know about the delay? I'd rather they hear it from you than from someone on site. — [4] —.<\/p><p>Owen<\/p>"}], "qs": [{"s": "Why was the e-mail sent?", "o": ["To report a problem with a delivery", "To request payment from a client", "To announce that a project has been completed", "To recommend a new supplier"], "a": 0, "n": "목적: 철골 배송이 2주 늦어짐 → 배송 문제 보고. 기초 공사는 예정대로(C와 혼동 유도).", "id": "t16-155", "w": "", "hit": false}, {"s": "What does Mr. Pryce suggest doing?", "o": ["Changing the completion date", "Adding more workers to a task", "Canceling an order", "Visiting the supplier's factory"], "a": 1, "n": "세부: bring in a second crew for the framing → 인력 추가. completion date는 '바꿀 필요 없다'고 함(A 함정).", "id": "t16-156", "w": "", "hit": false}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"I should hear back from them by tomorrow afternoon.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 2, "n": "문장 삽입: them = Hollis Construction. '팀이 있는지 물어봤다' 바로 뒤 [3]. [1] 위치의 them은 supplier로 오해할 수 있지만 '답을 듣는다'는 '질문한 대상' 뒤에 와야 자연스러움.", "id": "t16-157", "w": "hear back from them → 질문한 대상(Hollis) 바로 뒤 [3] ← [4] / 오답모음 재풀이 정답", "hit": true}]}, {"id": "t16-161", "kind": "Web page", "tabs": [{"l": "Web page", "h": "<div class=\"url\">https://www.northshorecc.org/rooms<\/div><h4>Renting a Room at Northshore Community Center<\/h4><p>Our rooms are available to community groups, nonprofit organizations, and private individuals. Rental rates depend on the size of the room and the type of group. Nonprofit organizations registered in Northshore County receive a 40 percent discount on all rates.<\/p><p>To reserve a room, complete the online request form at least 14 days before your event. A deposit of $50 is required at the time of booking. The deposit will be returned within one week after your event, provided that the room is left clean and all furniture is returned to its original position.<\/p><p>Please note that food may be served only in the Garden Room and the Main Hall, which have kitchens. Alcohol is not permitted anywhere in the building.<\/p>"}], "qs": [{"s": "For whom is the Web page most likely intended?", "o": ["Employees of the community center", "Instructors of community programs", "People planning an event", "Local restaurant owners"], "a": 2, "n": "대상: 방 대여 방법·조건 안내 → 행사를 계획하는 사람.", "id": "t16-161", "w": "대상 = 행사 계획하는 사람 ← employees / 오답모음 재풀이 정답", "hit": true}, {"s": "What is required to receive the full deposit back?", "o": ["Leaving a room in its original condition", "Booking a room 14 days in advance", "Registering as a nonprofit organization", "Serving food only in the Main Hall"], "a": 0, "n": "세부: room is left clean and furniture returned → 원래 상태로 두기. (B)는 '예약' 조건, (C)는 '할인' 조건을 끌어온 함정.", "id": "t16-162", "w": "", "hit": false}, {"s": "What is suggested about some rooms at the center?", "o": ["They are reserved for nonprofit groups.", "They have recently been renovated.", "Meals cannot be served in them.", "They cost more on weekends."], "a": 2, "n": "추론: 음식은 주방이 있는 두 방에서만 → 나머지 방에서는 식사 제공 불가. 두 문장을 이어서 판단.", "id": "t16-163", "w": "", "hit": false}]}, {"id": "t16-172", "kind": "online chat discussion", "tabs": [{"l": "online chat discussion", "h": "<div class=\"msg\"><b>Irene Castillo<\/b> <span>2:02 P.M.<\/span><br>Quick question about the Delgado account. Their contract renewal is due Friday, and they've asked for a 10 percent discount.<\/div><div class=\"msg\"><b>Ben Holloway<\/b> <span>2:04 P.M.<\/span><br>That's more than we usually offer. What did we give them last year?<\/div><div class=\"msg\"><b>Irene Castillo<\/b> <span>2:05 P.M.<\/span><br>Five percent. But their order volume has doubled since then.<\/div><div class=\"msg\"><b>Ben Holloway<\/b> <span>2:06 P.M.<\/span><br>Then I'd say it's worth considering. Yuki, what do you think?<\/div><div class=\"msg\"><b>Yuki Tanaka<\/b> <span>2:09 P.M.<\/span><br>Finance would have to approve anything above 7 percent. I can send them the numbers this afternoon.<\/div><div class=\"msg\"><b>Irene Castillo<\/b> <span>2:10 P.M.<\/span><br>That would help. Can you copy me?<\/div><div class=\"msg\"><b>Yuki Tanaka<\/b> <span>2:11 P.M.<\/span><br>Of course.<\/div><div class=\"msg\"><b>Ben Holloway<\/b> <span>2:13 P.M.<\/span><br>In the meantime, Irene, let them know we're reviewing their request. Don't promise anything yet.<\/div><div class=\"msg\"><b>Irene Castillo<\/b> <span>2:14 P.M.<\/span><br>Understood. I'll call them now.<\/div>"}], "qs": [{"s": "What are the writers mainly discussing?", "o": ["A new contract with a supplier", "A change in the finance department", "A client's request for a lower price", "An increase in shipping costs"], "a": 2, "n": "주제: Delgado의 10% 할인 요청 → 고객의 가격 인하 요청.", "id": "t16-172", "w": "주제: 고객의 할인 요청 ← contract 단어 재사용 오답", "hit": true}, {"s": "Why does Mr. Holloway think the request is worth considering?", "o": ["The client has been a customer for a long time.", "The client is buying much more than before.", "Competitors are offering lower prices.", "The finance department has approved it."], "a": 1, "n": "세부: Ben이 '고려할 만하다'고 한 건 바로 앞 '주문량이 두 배' 때문. (D)는 아직 승인 전.", "id": "t16-173", "w": "", "hit": false}, {"s": "At 2:11 P.M., what does Ms. Tanaka mean when she writes, \"Of course\"?", "o": ["She will call the client.", "She agrees to a 10 percent discount.", "She will approve the contract by Friday.", "She will include Ms. Castillo on an e-mail."], "a": 3, "n": "의도: 바로 앞 'Can you copy me?'(나도 참조로 넣어줄래?) → 메일 참조에 넣겠다.", "id": "t16-174", "w": "의도: 바로 앞 'Can you copy me?' → 참조 포함 ← 10% 동의", "hit": true}, {"s": "What will Ms. Castillo most likely tell the client?", "o": ["They will receive a 7 percent discount.", "Their contract will not be renewed.", "Their request is being considered.", "Their order will be shipped on Friday."], "a": 2, "n": "추론: 'let them know we're reviewing their request. Don't promise anything yet.' → 검토 중이라고 전함. 7%(A)는 승인 기준선이지 확정 할인 아님.", "id": "t16-175", "w": "", "hit": false}]}, {"id": "t23-158", "kind": "Web page", "tabs": [{"l": "Web page", "h": "<div class=\"url\">https://www.coastalkayaktours.com/tours<\/div><h4>Guided Tours<\/h4><p>Explore the shoreline of Marlow Bay with one of our experienced guides. All tours include a kayak, a paddle, a life jacket, and a short safety lesson before departure. No previous experience is necessary.<\/p><p><b>Sunrise Tour<\/b> (2 hours, $45): Watch the sun rise over the bay. Departs daily at 6:00 A.M.<\/p><p><b>Island Explorer<\/b> (4 hours, $80): Paddle to Gull Island and enjoy a picnic lunch on the beach. Lunch is provided. Departs Tuesday through Sunday at 10:00 A.M.<\/p><p><b>Evening Wildlife Tour<\/b> (2.5 hours, $55): Look for seals and seabirds as the sun sets. Departs Friday and Saturday at 5:30 P.M.<\/p><p>Tours may be canceled because of strong winds. If this happens, customers may choose a full refund or another tour date. Children under 12 must be accompanied by an adult.<\/p>"}], "qs": [{"s": "What is NOT included in the price of every tour?", "o": ["A meal", "Safety instructions", "The use of a kayak", "A life jacket"], "a": 0, "n": "NOT: 모든 투어 = 카약·노·구명조끼·안전 교육. 점심은 Island Explorer만 → A meal.", "id": "t23-158", "w": "NOT + every: 점심은 Island만 → A meal ← the use of a kayak", "hit": true}, {"s": "Which tour can customers take on a Monday?", "o": ["The Sunrise Tour", "The Island Explorer", "The Evening Wildlife Tour", "None of the tours"], "a": 0, "n": "세부: Sunrise는 daily, Island는 화~일, Evening은 금·토 → 월요일은 Sunrise만.", "id": "t23-159", "w": "", "hit": false}, {"s": "What happens if a tour is canceled because of the weather?", "o": ["Customers receive a partial refund.", "The tour leaves from another location.", "A guide calls customers the day before.", "Customers may choose a different date."], "a": 3, "n": "세부: full refund or another tour date → 다른 날짜 선택 가능. 환불은 전액(A 함정).", "id": "t23-160", "w": "세부 패러프레이즈: another tour date → different date ← another location", "hit": true}]}, {"id": "t23-161", "kind": "memo", "tabs": [{"l": "memo", "h": "<div class=\"hdr\"><div><b>To:<\/b> All Employees<\/div><div><b>From:<\/b> Victor Hale, Operations Director<\/div><div><b>Date:<\/b> November 2<\/div><div><b>Re:<\/b> Office relocation<\/div><\/div><p>As announced at last month's meeting, our office will move to the fourth floor of the Brennan Building on Monday, December 7. — [1] —. The new space is larger and includes two additional conference rooms, which should make scheduling meetings much easier.<\/p><p>Movers will pack and transport all furniture and equipment on Saturday, December 5. — [2] —. Each department will receive packing boxes on December 1. Please label each box with your name and your new desk number, which will be sent to you by e-mail next week.<\/p><p>Please take home any personal items that you do not want the movers to pack. — [3] —. The company cannot be responsible for items lost during the move. — [4] —.<\/p>"}], "qs": [{"s": "What is the purpose of the memo?", "o": ["To announce the purchase of a building", "To schedule a department meeting", "To give instructions for an upcoming move", "To request ideas for new conference rooms"], "a": 2, "n": "목적: 이사 날짜·포장·라벨·개인 물품 → 이사 안내.", "id": "t23-161", "w": "", "hit": false}, {"s": "What will employees receive by e-mail?", "o": ["Packing boxes", "A floor plan", "A list of moving companies", "Their new desk numbers"], "a": 3, "n": "세부: new desk number, which will be sent to you by e-mail. 박스는 12월 1일 부서로 배부(A 함정).", "id": "t23-162", "w": "", "hit": false}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"Items such as framed photographs and plants should be removed by Friday, December 4.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 2, "n": "문장 삽입: such as framed photographs and plants = 개인 물품의 예 → 'personal items를 집에 가져가라' 바로 뒤 [3]. [2]는 가구·장비 이야기라 개인 물품 예시가 붙지 않음.", "id": "t23-163", "w": "문장삽입: 개인 물품 예시 → [3] ← [2]", "hit": true}]}, {"id": "t23-164", "kind": "article", "tabs": [{"l": "article", "h": "<h4>Small Roaster, Big Plans<\/h4><p class=\"by\">By Helen Marsh<\/p><p>When Aiden Clarke opened Copperfield Coffee Roasters in a converted garage in 2016, he sold his beans only at weekend farmers markets. Today, the company supplies more than 120 cafés and grocery stores in three states, and its products are sold online throughout the country.<\/p><p>Mr. Clarke credits much of the company's growth to a decision he made in 2019. Instead of buying beans through importers, he began working directly with small farms in Colombia and Ethiopia. — [1] —. Although the change required him to travel abroad several times a year, it allowed Copperfield to pay farmers higher prices while keeping its own costs stable.<\/p><p>The company's popularity has created a new challenge: space. — [2] —. Copperfield's roasting facility on Dunmore Road, which it moved into in 2020, is already operating at full capacity. Next spring, the company will move to a building in the Eastgate business district that is three times larger. — [3] —.<\/p><p>Mr. Clarke says the new facility will also include a small café and a training room where baristas can take classes. \"We started by talking to customers face-to-face,\" he said. \"I want to keep doing that, even as we grow.\" — [4] —.<\/p>"}], "qs": [{"s": "What is the article mainly about?", "o": ["The growth of a local business", "The opening of a farmers market", "Coffee farming in Colombia", "A training program for baristas"], "a": 0, "n": "주제: 차고에서 시작 → 120곳 공급 → 더 큰 시설로 이전 → 사업 성장.", "id": "t23-164", "w": "", "hit": false}, {"s": "What is indicated about Copperfield Coffee Roasters?", "o": ["It owns farms in Ethiopia.", "It originally sold its products in person.", "It operates cafés in three states.", "It was founded in 2019."], "a": 1, "n": "사실 확인: 처음엔 주말 농산물 시장에서만 판매 → 직접 대면 판매. (A)는 농장과 '직거래'일 뿐 소유 아님, (C)는 카페에 '공급'(supplies)이지 운영 아님, (D)는 직거래 시작 연도.", "id": "t23-165", "w": "사실확인: supplies cafés/works directly with farms ← owns farms(단어 재사용 함정)", "hit": true}, {"s": "Why will the company move?", "o": ["Its current facility is too small.", "Its lease on Dunmore Road is ending.", "It wants to be closer to its customers.", "It plans to stop selling online."], "a": 0, "n": "세부: operating at full capacity + three times larger → 지금 시설이 좁다(패러프레이즈).", "id": "t23-166", "w": "", "hit": false}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"This also gave him greater control over the quality of the beans.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 0, "n": "문장 삽입: This = 농장과 직거래 결정 → 그 바로 뒤 [1]. also는 뒤 문장의 '농부에게 더 높은 가격' 이점과 나란히 놓임.", "id": "t23-167", "w": "문장삽입: This = 농장 직거래 결정 → [1] ← [3]", "hit": true}]}, {"id": "t33-155", "kind": "article", "tabs": [{"l": "article", "h": "<h4>Ashford Library Adds Tool-Lending Collection<\/h4><p>ASHFORD (March 3)—Residents of Ashford can now borrow more than books from their public library. Last week, the Ashford Public Library opened a tool-lending collection that includes power drills, ladders, garden equipment, and sewing machines. Library card holders may borrow up to three tools at a time for one week, and items can be renewed once if no one else has requested them.<\/p><p>The collection was made possible by a $40,000 grant from the Ashford Community Foundation, along with donations of used tools from local residents and two hardware stores. Head librarian Martin Hale said the idea came from a survey conducted last fall, in which many residents said they needed tools for occasional home repairs but could not justify buying them.<\/p><p>Before borrowing a power tool for the first time, patrons must attend a free 30-minute safety class. Classes are held every Saturday morning, and space is <u>limited<\/u>, so registration is recommended.<\/p>"}], "qs": [{"s": "What is the article mainly about?", "o": ["A new service offered by a library", "The opening of a hardware store", "A survey of homeowners in the area", "A safety class for power tools"], "a": 0, "n": "주제: 도서관의 공구 대여 서비스 신설.", "id": "t33-155", "w": "", "hit": false}, {"s": "What is NOT mentioned as a source of support for the collection?", "o": ["The city's annual budget", "A local charitable foundation", "Area residents", "Local businesses"], "a": 0, "n": "NOT: 재단 보조금(B), 주민 기증(C), 철물점 2곳(D). 시 예산은 언급 없음.", "id": "t33-156", "w": "", "hit": false}, {"s": "The word \"limited\" in paragraph 3 is closest in meaning to", "o": ["restricted", "narrow", "temporary", "specialized"], "a": 0, "n": "동의어: space is limited = 자리가 한정됨 → restricted.", "id": "t33-157", "w": "동의어 limited(인원 한정)=restricted. 문장에 넣어 확인. narrow(폭 좁은) 고름", "hit": true}]}, {"id": "t33-164", "kind": "article", "tabs": [{"l": "article", "h": "<h4>Small Bakery, Big Following<\/h4><p class=\"by\">By Lucas Grant<\/p><p>When Mira Santos opened Crumb &amp; Co. in a former shoe repair shop on Hollis Street in 2019, she baked everything herself in a kitchen barely large enough for two ovens. — [1] —. Today the bakery employs fourteen people, supplies bread to nine restaurants, and regularly has a line out the door on weekend mornings.<\/p><p>Ms. Santos credits much of that growth to a decision she made during her first winter, when sales slowed. Rather than lower her prices, she began offering a monthly bread subscription, in which customers pay in advance for one loaf each week. — [2] —. The program gave the bakery a steady income during slow months and helped Ms. Santos plan how much flour to order.<\/p><p>The bakery's success has not come without difficulties. Last year, the rising cost of butter forced Ms. Santos to raise the price of her croissants twice. — [3] —. Some customers complained at first, but sales recovered within a few weeks.<\/p><p>Next month, Crumb &amp; Co. will open a second location in the Eastgate Mall. Unlike the original shop, it will not have its own kitchen; instead, baked goods will be delivered there each morning from Hollis Street. — [4] —.<\/p>"}], "qs": [{"s": "What is the article mainly about?", "o": ["The opening of a shopping mall", "A shortage of butter in the region", "Changes to a shoe repair business", "The growth of a local bakery"], "a": 3, "n": "주제: 동네 빵집의 성장 이야기.", "id": "t33-164", "w": "", "hit": false}, {"s": "According to the article, what did Ms. Santos do during her first winter?", "o": ["She lowered her prices.", "She hired additional bakers.", "She started a prepaid program.", "She bought a larger oven."], "a": 2, "n": "세부: Rather than lower her prices, she began offering a subscription (선결제). B는 정반대.", "id": "t33-165", "w": "", "hit": false}, {"s": "What is indicated about the Eastgate Mall location?", "o": ["It will sell goods baked elsewhere.", "It will have a larger kitchen.", "It will open only on weekends.", "It will supply nine restaurants."], "a": 0, "n": "사실 확인: 자체 주방 없음 → Hollis Street에서 매일 아침 배송. 9곳 납품은 본점 이야기(D).", "id": "t33-166", "w": "역할 바꿔치기: 9개 식당 납품은 본점, 지점은 자체 주방 없이 배달받아 판매 (D 고름)", "hit": true}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"More than 200 people signed up within the first two months.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 1, "n": "문장 삽입: signed up = 구독 '가입' → 구독 프로그램 소개 직후 [2].", "id": "t33-167", "w": "", "hit": false}]}, {"id": "t34-149", "kind": "text-message chain", "tabs": [{"l": "text-message chain", "h": "<div class=\"msg\"><b>Kenji Mori<\/b> <span>2:41 P.M.<\/span><br>Are you still at the print shop?<\/div><div class=\"msg\"><b>Lucia Ferrante<\/b> <span>2:43 P.M.<\/span><br>Just leaving. Why?<\/div><div class=\"msg\"><b>Kenji Mori<\/b> <span>2:44 P.M.<\/span><br>Ms. Han called. She wants the brochures to show our new Elm Street address, not the old one on Pine Avenue.<\/div><div class=\"msg\"><b>Lucia Ferrante<\/b> <span>2:46 P.M.<\/span><br>The whole batch is boxed and in my car.<\/div><div class=\"msg\"><b>Kenji Mori<\/b> <span>2:47 P.M.<\/span><br>How many did they print?<\/div><div class=\"msg\"><b>Lucia Ferrante<\/b> <span>2:48 P.M.<\/span><br>Five hundred. I can ask them to run a corrected batch, but not before Monday.<\/div><div class=\"msg\"><b>Kenji Mori<\/b> <span>2:50 P.M.<\/span><br>Do that. The trade fair isn't until Thursday. We'll use these for the mailing to existing clients. They know where to find us.<\/div>"}], "qs": [{"s": "At 2:46 P.M., what does Ms. Ferrante most likely mean when she writes, \"The whole batch is boxed and in my car\"?", "o": ["She is unable to deliver the order today.", "She has lost the client's phone number.", "The brochures have already been printed.", "She has not yet checked the order."], "a": 2, "n": "의도: 주소 바꿔달라는 요청 ↔ 이미 다 인쇄돼서 차에 실림 → 이미 늦음.", "id": "t34-149", "w": "의도: 주소 변경 요청 ↔ \"이미 박스에 담겨 차에 있다\" = 이미 인쇄됨(늦음). 근거 없는 선지(not yet checked) 고름", "hit": true}, {"s": "What is suggested about the writers' company?", "o": ["It will attend a trade fair on Monday.", "It sells printing equipment to stores.", "It is planning to reduce its staff.", "It has recently moved to a new address."], "a": 3, "n": "추론: our new Elm Street address, not the old one → 최근 이전. 박람회는 목요일(A).", "id": "t34-150", "w": "", "hit": false}]}, {"id": "t34-155", "kind": "article", "tabs": [{"l": "article", "h": "<h4>Halden Transit Wins Accessibility Award<\/h4><p>HALDEN (October 2)—Halden Regional Transit has been named this year's recipient of the National Mobility Council's Access Award, which <u>recognizes<\/u> public transportation systems that have made significant improvements for riders with disabilities. Over the past three years, the agency has replaced its entire fleet of 64 buses with low-floor models, installed audio announcements at every downtown stop, and trained all of its drivers to assist passengers who use wheelchairs.<\/p><p>\"Many of these changes benefit everyone,\" said general manager Teresa Lindqvist, noting that parents with strollers and travelers with heavy luggage have also praised the new buses. The upgrades were funded largely through a federal grant, with the remainder covered by a modest fare increase approved in 2023.<\/p><p>The award will be presented at the council's annual conference in Denver next month. Ms. Lindqvist said the agency's next goal is to add audio announcements to stops outside the downtown area by the end of next year.<\/p>"}], "qs": [{"s": "Why did Halden Regional Transit receive an award?", "o": ["It lowered the cost of its fares.", "It opened new routes to suburban areas.", "It improved service for riders with disabilities.", "It reduced travel times on most routes."], "a": 2, "n": "주제: 장애인 승객을 위한 개선 → 일부 승객이 더 쉽게 이용.", "id": "t34-155", "w": "", "hit": false}, {"s": "The word \"recognizes\" in paragraph 1 is closest in meaning to", "o": ["identifies", "honors", "admits", "remembers"], "a": 1, "n": "동의어: 상이 ~를 '기리다, 표창하다' → honors. identifies(알아보다)는 근접 오답.", "id": "t34-156", "w": "동의어 recognize(상이 ~를) = honors. admits(잘못을 시인하다)는 한국어 \"인정하다\" 함정", "hit": true}, {"s": "What is indicated about the upgrades?", "o": ["They took less than a year to finish.", "Ms. Lindqvist designed them herself.", "They were required by a new law.", "Passengers covered part of their cost."], "a": 3, "n": "사실(두 문장 결합): 나머지는 요금 인상으로 충당 → 승객도 비용 일부 부담.", "id": "t34-157", "w": "over the past three years ↔ less than a year X. 나머지 비용을 요금 인상으로 → 승객 일부 부담. ? 표시하고 소거 안 함", "hit": true}]}, {"id": "t34-164", "kind": "article", "tabs": [{"l": "article", "h": "<h4>From Classroom to Kitchen Table<\/h4><p class=\"by\">By Nadia Chowdhury<\/p><p>For most of her twelve years as a high school chemistry teacher, Grace Okoye spent her summers developing recipes in her small apartment kitchen. — [1] —. Last year, she turned that hobby into a business. Her company, Measured Spoon, sells boxes of pre-measured dry ingredients for breads and cakes, along with step-by-step instruction cards written in the clear, patient style she once used with students.<\/p><p>Ms. Okoye began by selling the boxes at weekend markets in Fairburn. — [2] —. Within six months, demand had outgrown her kitchen, and she began renting space in a commercial kitchen used by several local food businesses.<\/p><p>Rather than buy advertising, Ms. Okoye relies on customers posting photos of their finished loaves online. \"Every picture is a recommendation from someone our customers already trust,\" she said. — [3] —.<\/p><p>Measured Spoon now ships to customers in four states. This fall, Ms. Okoye plans to introduce boxes designed for children, with simpler instructions and smaller portions. She still teaches one evening class a week at a community center. — [4] —.<\/p>"}], "qs": [{"s": "What is the article mainly about?", "o": ["A former teacher's food business", "A cooking class for young children", "The opening of a commercial kitchen", "A popular weekend market in Fairburn"], "a": 0, "n": "주제: 화학 교사 출신의 베이킹 키트 사업.", "id": "t34-164", "w": "주제 문제: 제목 + 첫 문단. commercial kitchen 임대는 세부(부분을 전체로)", "hit": true}, {"s": "What is suggested about the instruction cards?", "o": ["They were written by several of her former students.", "They are printed in several languages.", "They were reviewed by a well-known chef.", "They match the style she used as a teacher."], "a": 3, "n": "추론: written in the clear style she once used with students.", "id": "t34-165", "w": "", "hit": false}, {"s": "How does Measured Spoon mainly attract new customers?", "o": ["Through discounts on first orders", "Through a partnership with grocers", "Through photos posted by customers", "Through booths at weekend markets"], "a": 2, "n": "세부(패러프레이즈): customers posting photos online. 주말 시장은 '처음' 판매 방식(D 근접 오답).", "id": "t34-166", "w": "", "hit": false}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"At first, she often sold out of her entire stock by noon on Saturdays.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 1, "n": "문장 삽입: 주말 시장 판매 시작 → 토요일 정오 매진 → 수요가 주방을 넘어섬 [2].", "id": "t34-167", "w": "", "hit": false}]}, {"id": "t38-147", "kind": "notice", "tabs": [{"l": "notice", "h": "<h4>Harlow Public Library: Laptop Lending Program<\/h4><p>Starting March 3, cardholders can borrow laptops for use anywhere in the library building. Laptops may be checked out at the information desk on the second floor for up to three hours at a time. A valid library card and a photo ID are required.<\/p><p>Laptops must be returned to the information desk at least 15 minutes before the library closes. Users who return a laptop late will not be able to borrow one again for 30 days. Files saved on the laptops are deleted automatically when the devices are returned.<\/p>"}], "qs": [{"s": "What is indicated about the laptops?", "o": ["They can be reserved online.", "They may be borrowed for an entire day.", "They cannot be taken out of the library.", "They are available on every floor."], "a": 2, "n": "[불명확] 선지 진위판단. for use anywhere in the library building = 도서관 밖 반출 불가. three hours(하루 X), desk on the second floor(모든 층 X).", "id": "t38-147", "w": "", "hit": false}, {"s": "What will happen if a laptop is returned late?", "o": ["The borrower will be charged a fee for each additional hour.", "The borrower will be temporarily unable to use the service.", "The borrower's files will be saved.", "The borrower's library card will be canceled."], "a": 1, "n": "[명확] 주관식 답 먼저: late → 30일간 대여 불가 → 선지에서 위치만 찾기. 파일은 자동 삭제(저장 X).", "id": "t38-148", "w": "", "hit": false}]}, {"id": "t38-158", "kind": "text-message chain", "tabs": [{"l": "text-message chain", "h": "<div class=\"msg\"><b>Lena Ortiz<\/b> <span>9:41 A.M.<\/span><br>Hi, Marcus. The caterer just called. They can't deliver lunch for the training session until 12:30.<\/div><div class=\"msg\"><b>Marcus Bell<\/b> <span>9:43 A.M.<\/span><br>The session breaks for lunch at noon, though. Thirty minutes is a long time to keep forty people waiting.<\/div><div class=\"msg\"><b>Lena Ortiz<\/b> <span>9:44 A.M.<\/span><br>I know. I could ask Ms. Quan to move her afternoon presentation to just before lunch.<\/div><div class=\"msg\"><b>Marcus Bell<\/b> <span>9:46 A.M.<\/span><br>That would work. She told me yesterday that her slides are ready.<\/div><div class=\"msg\"><b>Lena Ortiz<\/b> <span>9:47 A.M.<\/span><br>Great. I'll let her know and update the printed schedule.<\/div><div class=\"msg\"><b>Marcus Bell<\/b> <span>9:48 A.M.<\/span><br>Don't bother with that. Just announce the change when the session starts.<\/div>"}], "qs": [{"s": "What problem does Ms. Ortiz mention?", "o": ["A presenter has canceled.", "A room is too small for the participants.", "A delivery will arrive later than planned.", "Some slides have not been prepared."], "a": 2, "n": "[명확] 주관식 답: 점심 배달이 12:30으로 늦음. slides는 오히려 준비됨.", "id": "t38-158", "w": "", "hit": false}, {"s": "What will most likely happen at the training session?", "o": ["Lunch will be served at noon.", "The session will end early.", "Updated printed schedules will be handed out to all participants.", "A presentation will be given earlier than scheduled."], "a": 3, "n": "[명확] 오후 발표를 점심 직전으로 당김. 점심은 12:30, 인쇄 일정표는 고치지 않기로 함.", "id": "t38-159", "w": "", "hit": false}, {"s": "At 9:48 A.M., what does Mr. Bell most likely mean when he writes, \"Don't bother with that\"?", "o": ["Ms. Ortiz should not contact Ms. Quan.", "He would prefer to announce the change to the group himself.", "Ms. Ortiz does not need to revise a document.", "The schedule change is unnecessary."], "a": 2, "n": "[의도] 바로 앞 문장(update the printed schedule)을 받음 → 일정표 수정 불필요. 안내는 Ms. Ortiz가 세션 시작 때.", "id": "t38-160", "w": "", "hit": false}]}, {"id": "t38-168", "kind": "article", "tabs": [{"l": "article", "h": "<p>KINGSTON (April 14)—Dorsey Foods, a maker of packaged soups and sauces, announced on Monday that it will open a second production plant in Kingston next spring. — [1] —. The company, which has operated a plant in nearby Westfield since 1998, said the new site will allow it to meet growing demand from supermarkets in the region.<\/p><p>The Harbor Road facility will create about 120 jobs, most of them in production and quality control. Dorsey Foods has already <u>secured<\/u> funding for the project from two regional banks. — [2] —. Hiring is expected to begin in January.<\/p><p>Company president Alicia Grant said the Westfield plant will remain open. \"Our Westfield employees have been with us for decades,\" she said. \"The new plant will add to what we do there, not replace it.\" — [3] —. Ms. Grant added that the Kingston plant will be the first in the company to run entirely on solar power. — [4] —.<\/p>"}], "qs": [{"s": "What is the article mainly about?", "o": ["The closure of a factory", "A company's plan to expand production", "A change in company leadership", "A new line of food products"], "a": 1, "n": "[불명확: 주제] 첫 문장 = 두 번째 공장 개설. Westfield는 계속 운영(폐쇄 X).", "id": "t38-168", "w": "", "hit": false}, {"s": "What is suggested about the Westfield plant?", "o": ["It will be replaced by the new facility.", "It has been in operation for many years.", "It runs entirely on solar power.", "It is located on Harbor Road."], "a": 1, "n": "[불명확] since 1998 + employees for decades → 오래 운영. 태양광·Harbor Road는 Kingston 공장 얘기(대상 바꿔치기).", "id": "t38-169", "w": "", "hit": false}, {"s": "The word \"secured\" in paragraph 2 is closest in meaning to", "o": ["protected", "fastened", "guaranteed", "obtained"], "a": 3, "n": "[동의어] secured funding = 자금을 확보했다 → obtained. 문장에 넣어서 확인.", "id": "t38-170", "w": "", "hit": false}, {"s": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?<br/><br/>\"These loans will cover nearly half of the construction costs.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 1, "n": "[문장삽입] These loans(지시어) → 받아주는 말 = funding from two regional banks → 바로 뒤 [2].", "id": "t38-171", "w": "", "hit": false}]}, {"id": "t39-151", "kind": "report", "tabs": [{"l": "report", "h": "<h4>APP USABILITY REPORT<\/h4><p>April 2<br/>Application: Parkwise 3.1<br/>Test period: March 24–26<br/>Number of testers: 10<\/p><p><b>Overview:<\/b> Testers were asked to carry out four tasks using the redesigned Parkwise screen. In task 1, testers located a parking garage near a given address. In task 2, testers reserved a parking space. In task 3, testers paid a parking fee. In task 4, testers added time to an existing reservation.<\/p><p><b>Initial findings:<\/b> Task 4 caused the most trouble, with four testers giving up before finishing. The likely reason is that the button for this function appears only after the user scrolls to the bottom of the screen. Moving the button to the top of the screen could solve the problem.<\/p>"}], "qs": [{"s": "What is true about the test?", "o": ["It compared two versions of the app.", "It was carried out in a parking garage.", "It required testers to fill out a questionnaire.", "It lasted more than one day."], "a": 3, "n": "[불명확] 선지 진위판단. 헤더 Test period: March 24–26 → 하루 넘게. parking garage는 과제 내용(단어 재사용). (T1-151)", "id": "t39-151", "w": "", "hit": false}, {"s": "What did testers have difficulty doing?", "o": ["Finding a garage", "Extending a booking", "Reserving a space", "Making a payment"], "a": 1, "n": "[명확] 주관식 답 먼저: 가장 어려운 것 = task 4 = added time to an existing reservation → Extending a booking. (T1-152)", "id": "t39-152", "w": "", "hit": false}]}, {"id": "t39-172", "kind": "online chat discussion", "tabs": [{"l": "online chat discussion", "h": "<div class=\"msg\"><b>Helen Park<\/b> <span>10:02 A.M.<\/span><br>How did the interview with Ms. Okoye go yesterday?<\/div><div class=\"msg\"><b>Omar Reyes<\/b> <span>10:03 A.M.<\/span><br>Very well. Her drawings are excellent, and she already knows the software we use for our building plans.<\/div><div class=\"msg\"><b>Helen Park<\/b> <span>10:05 A.M.<\/span><br>Good. I noticed she has worked in furniture design and stage design as well as architecture. That range should help with our hotel projects.<\/div><div class=\"msg\"><b>Omar Reyes<\/b> <span>10:06 A.M.<\/span><br>I agree. Tariq, could you arrange a second interview with her? I hope that isn't too much to ask on a busy day.<\/div><div class=\"msg\"><b>Tariq Aziz<\/b> <span>10:07 A.M.<\/span><br>No trouble at all. When should it be?<\/div><div class=\"msg\"><b>Omar Reyes<\/b> <span>10:09 A.M.<\/span><br>Helen, you'll be joining us this time. Keep in mind that Mr. Lund will ask why she wants to leave freelance work. He'll also want to be sure she isn't planning to move on after a year or two.<\/div><div class=\"msg\"><b>Helen Park<\/b> <span>10:10 A.M.<\/span><br>Understood. Tariq, Mr. Lund and I are both free on Thursday afternoon.<\/div><div class=\"msg\"><b>Tariq Aziz<\/b> <span>10:12 A.M.<\/span><br>Perfect. I'll e-mail her now.<\/div>"}], "qs": [{"s": "For what type of business do the writers most likely work?", "o": ["A furniture store", "A theater company", "An architecture firm", "A hotel chain"], "a": 2, "n": "[명확] building plans + architecture + hotel projects(고객). furniture·stage·hotel은 지문 단어 재사용.", "id": "t39-172", "w": "", "hit": false}, {"s": "At 10:07 A.M., what does Mr. Aziz most likely mean when he writes, \"No trouble at all\"?", "o": ["He had no difficulty reaching Ms. Okoye.", "He thinks the interview went smoothly.", "He is willing to do what was asked.", "He does not need to attend the meeting."], "a": 2, "n": "[의도] 바로 앞 요청(두 번째 면접 잡아 달라)에 대한 대답. (T1-173)", "id": "t39-173", "w": "", "hit": false}, {"s": "What is indicated about Ms. Okoye?", "o": ["She has designed hotels before.", "She has experience in several fields.", "She used to work with Ms. Park.", "She has never worked on her own."], "a": 1, "n": "[불명확] furniture design, stage design, architecture → 여러 분야 경력. 호텔은 회사 프로젝트. (T1-174)", "id": "t39-174", "w": "", "hit": false}, {"s": "According to the discussion, what will Mr. Lund want to know?", "o": ["Whether Ms. Okoye intends to stay with the company", "Whether Ms. Okoye can start right away", "Whether Ms. Okoye has managed a team", "Whether Ms. Okoye is available to meet on Thursday afternoon"], "a": 0, "n": "[명확] 주관식 답: 1~2년 뒤 떠날 계획이 아닌지 → 오래 다닐지. 병렬: will ask ~ / will also want to be sure ~. (T1-175)", "id": "t39-175", "w": "", "hit": false}]}], "p7m": [{"id": "t16-176", "kind": "Web page and e-mail", "tabs": [{"l": "Web page", "h": "<div class=\"url\">https://www.greystonehotel.com/events<\/div><h4>Private Dining at the Greystone<\/h4><p>Host your next celebration or business dinner in one of our private dining rooms. Each room is served by its own wait staff, and menus can be customized by our executive chef.<\/p><p>• The Library: seats up to 14 — minimum spending $600<\/p><p>• The Terrace: seats up to 30, outdoor (May–September only) — minimum spending $1,200<\/p><p>• The Ballroom: seats up to 80 — minimum spending $3,000; includes a dance floor<\/p><p>Hotel guests receive a complimentary bottle of sparkling water for each table. Bookings for groups of 20 or more require a 25 percent deposit. Cancellations made less than seven days before the event are not refundable.<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> events@greystonehotel.com<\/div><div><b>From:<\/b> Amira Haddad<\/div><div><b>Date:<\/b> September 25<\/div><div><b>Subject:<\/b> Dinner on October 18<\/div><\/div><p>Hello,<\/p><p>I'd like to book a private room for a dinner to celebrate my parents' 40th wedding anniversary on Saturday, October 18. We expect 24 guests. My parents loved having dinner outdoors at your hotel last summer, but I realize that may not be possible in October.<\/p><p>My father cannot eat dairy products, so we would need a menu that takes this into account. Also, several relatives will be traveling from out of town and staying at the Greystone that weekend. Is there any way to arrange a dance floor for a smaller group?<\/p><p>Best regards,<br/>Amira Haddad<\/p>"}], "qs": [{"s": "What is indicated about the private dining rooms?", "o": ["They are all located outdoors.", "They are available only to hotel guests.", "Each has its own servers.", "They require a deposit for all bookings."], "a": 2, "n": "사실 확인: Each room is served by its own wait staff. 보증금은 20명 이상만(D 함정).", "id": "t16-176", "w": "", "hit": false}, {"s": "Which room will Ms. Haddad most likely reserve?", "o": ["The Ballroom", "The Library", "The Terrace", "A hotel guest room"], "a": 0, "n": "연계: 24명 → Library(14) 부족. Terrace(30)는 5~9월만이라 10월 불가(그녀도 인정) → Ballroom. 춤 공간 문의와도 맞음.", "id": "t16-177", "w": "연계: Terrace는 5~9월만 + 10월 행사 → Ballroom ← Terrace", "hit": true}, {"s": "What is suggested about Ms. Haddad?", "o": ["She will need to pay a deposit.", "She is organizing a business dinner.", "She has never visited the Greystone.", "She lives in the same city as her parents."], "a": 0, "n": "연계: 20명 이상은 25% 보증금 → 24명이라 해당. 작년 여름 방문(C 반대), 기념일 저녁(B 반대).", "id": "t16-178", "w": "", "hit": false}, {"s": "What special request does Ms. Haddad make?", "o": ["A meal that suits a dietary restriction", "An outdoor table", "A discount for hotel guests", "Live music"], "a": 0, "n": "세부: 아버지가 유제품 불가 → 식이 제한에 맞는 메뉴. 야외는 '불가능할 것 같다'고 스스로 인정(B 함정).", "id": "t16-179", "w": "", "hit": false}, {"s": "What will some of Ms. Haddad's relatives most likely receive?", "o": ["A free room upgrade", "Complimentary water", "A refund on their booking", "A discount on the dance floor"], "a": 1, "n": "연계: 친척 일부가 그 주말에 Greystone 투숙 + 투숙객에게 테이블당 탄산수 무료 → complimentary water.", "id": "t16-180", "w": "연계: 투숙객 → 무료 생수 ← 지문에 없는 room upgrade", "hit": true}]}, {"id": "t16-186", "kind": "advertisement, e-mail, and schedule", "tabs": [{"l": "advertisement", "h": "<h4>Summit Professional Training<\/h4><p>Advance your career with our one-day workshops, led by experienced industry professionals. All workshops take place at our downtown training center at 85 Monroe Street and include lunch and a certificate of completion.<\/p><p><b>Spring Workshops<\/b><\/p><ul><li>Project Management Basics — $290<\/li><li>Negotiating with Confidence — $310<\/li><li>Data Visualization for Managers — $340<\/li><li>Writing for Business — $260<\/li><\/ul><p>Register for any two workshops and receive 15 percent off the total. Groups of four or more from the same company save 20 percent on every workshop. Discounts cannot be combined.<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> registration@summittraining.com<\/div><div><b>From:<\/b> Noah Brennan<\/div><div><b>Date:<\/b> March 3<\/div><div><b>Subject:<\/b> Registration<\/div><\/div><p>Hello,<\/p><p>I'd like to register myself and three colleagues from Halden Logistics for the Negotiating with Confidence workshop. I would also like to attend the data visualization workshop on my own, since I've recently begun preparing monthly reports for our board.<\/p><p>Our office is in Westport, so a workshop starting after 9:30 A.M. would be easiest for us. Could you tell me which dates are available?<\/p><p>Thank you,<br/>Noah Brennan, Operations Manager<\/p>"}, {"l": "schedule", "h": "<h4>Summit Professional Training — April Schedule<\/h4><div class=\"tw\"><table><tr><th>Workshop<\/th><th>Date<\/th><th>Start time<\/th><th>Instructor<\/th><\/tr><tr><td>Negotiating with Confidence<\/td><td>April 8<\/td><td>8:30 A.M.<\/td><td>Lara Quinn<\/td><\/tr><tr><td>Data Visualization for Managers<\/td><td>April 10<\/td><td>10:00 A.M.<\/td><td>Sam Reyes<\/td><\/tr><tr><td>Negotiating with Confidence<\/td><td>April 16<\/td><td>10:00 A.M.<\/td><td>Lara Quinn<\/td><\/tr><tr><td>Writing for Business<\/td><td>April 22<\/td><td>9:00 A.M.<\/td><td>Owen Park<\/td><\/tr><\/table><\/div><p>All workshops end at 4:30 P.M. Seats are limited to 20 participants per workshop.<\/p>"}], "qs": [{"s": "What is included in the price of each workshop?", "o": ["Transportation", "A textbook", "A meal", "Parking"], "a": 2, "n": "세부: include lunch and a certificate → 식사.", "id": "t16-186", "w": "", "hit": false}, {"s": "Why does Mr. Brennan want to attend the data visualization workshop?", "o": ["His colleagues recommended it.", "He has new reporting duties.", "He wants to become an instructor.", "His company requires it."], "a": 1, "n": "세부: 'recently begun preparing monthly reports for our board' → 새로 맡은 보고 업무.", "id": "t16-187", "w": "", "hit": false}, {"s": "What discount will Mr. Brennan's group most likely receive for the negotiation workshop?", "o": ["20 percent", "15 percent", "35 percent", "No discount"], "a": 0, "n": "연계: 본인 + 동료 3명 = 4명 → 단체 20%. 15%는 '두 개 등록' 할인이고 중복 불가 → 35%는 함정.", "id": "t16-188", "w": "연계: 4명 → 단체 20% ← 'cannot be combined'를 할인 없음으로 오해", "hit": true}, {"s": "On what date will the group most likely attend the negotiation workshop?", "o": ["April 16", "April 8", "April 10", "April 22"], "a": 0, "n": "연계: 9:30 이후 시작 희망 → 4월 8일(8:30)은 탈락, 4월 16일(10:00) 선택.", "id": "t16-189", "w": "", "hit": false}, {"s": "What is true about the workshops on the schedule?", "o": ["They are all taught by Ms. Quinn.", "They are all held in Westport.", "They all begin in the morning before 9:00 A.M.", "They all end at the same time."], "a": 3, "n": "사실 확인: All workshops end at 4:30 P.M. Westport는 Brennan의 사무실 위치(B 함정).", "id": "t16-190", "w": "", "hit": false}]}, {"id": "t16-196", "kind": "Web page, review, and e-mail", "tabs": [{"l": "Web page", "h": "<div class=\"url\">https://www.alpinecabins.com/booking<\/div><h4>Booking Information<\/h4><p>Alpine Ridge Cabins offers eight cabins on the shore of Lake Merritt. Each cabin has a kitchen, a fireplace, and a private deck.<\/p><p>• Standard cabin (sleeps 4): $140 per night<\/p><p>• Family cabin (sleeps 6): $195 per night<\/p><p>• Lakeside cabin (sleeps 4, private dock): $230 per night<\/p><p>A two-night minimum stay applies on weekends. Guests who stay five nights or more receive one night free. Canoes and bicycles are available at no extra charge; fishing equipment can be rented at the front office.<\/p>"}, {"l": "review", "h": "<div class=\"url\">https://www.travelnotes.com/reviews<\/div><h4>Peaceful week at Alpine Ridge<\/h4><p>My husband and I spent five nights at Alpine Ridge in August and loved having our own dock right outside the door; we took the canoe out every morning. The cabin was clean and well equipped, though the Wi-Fi was weak.<\/p><p>The only disappointment was that the front office was closed on the day we wanted to rent fishing rods, even though the Web site said it would be open. Still, we will definitely be back. —Lena Novak<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> Lena Novak<\/div><div><b>From:<\/b> Martin Hale, Alpine Ridge Cabins<\/div><div><b>Date:<\/b> September 2<\/div><div><b>Subject:<\/b> Your review<\/div><\/div><p>Dear Ms. Novak,<\/p><p>Thank you for your kind review. I am sorry about the front office. Our manager had to close it unexpectedly that day due to a family emergency, and we failed to post a notice. We have since hired a second staff member so that this will not happen again.<\/p><p>As a thank-you, I would like to offer you free fishing equipment rental on your next visit. We have also upgraded our Internet service, so I hope you will find it much improved.<\/p><p>Warm regards,<br/>Martin Hale, Owner<\/p>"}], "qs": [{"s": "What is indicated about all of the cabins?", "o": ["They have a private dock.", "They have cooking facilities.", "They sleep six people.", "They include fishing equipment."], "a": 1, "n": "사실 확인: Each cabin has a kitchen → 조리 시설. 전용 부두는 Lakeside만(A 함정).", "id": "t16-196", "w": "all cabins → kitchen = cooking facilities ← fishing equipment(렌탈은 front office)", "hit": true}, {"s": "Which cabin did Ms. Novak most likely stay in?", "o": ["A Lakeside cabin", "A Standard cabin", "A Family cabin", "She stayed in two different cabins."], "a": 0, "n": "연계: 리뷰 '문 바로 앞 우리 전용 부두' + 웹 'Lakeside cabin (private dock)'.", "id": "t16-197", "w": "연계: 리뷰 'our own dock' + 웹 'Lakeside (private dock)' ← Family cabin", "hit": true}, {"s": "How many nights did Ms. Novak most likely pay for?", "o": ["Four", "Five", "Two", "Six"], "a": 0, "n": "연계 계산: 5박 + '5박 이상이면 1박 무료' → 4박 요금.", "id": "t16-198", "w": "", "hit": false}, {"s": "Why was Ms. Novak unable to rent fishing equipment?", "o": ["The equipment was already rented.", "The Web site listed the wrong price.", "The office had moved.", "An employee was absent."], "a": 3, "n": "연계: 리뷰 '사무실이 닫혀 있었다' + 이메일 '매니저가 가족 일로 갑자기 닫았다' → 직원 부재.", "id": "t16-199", "w": "", "hit": false}, {"s": "What problem mentioned in the review has Mr. Hale addressed?", "o": ["The cleanliness of the cabin", "The price of the canoes", "The size of the cabin", "The weak Internet connection"], "a": 3, "n": "연계: 리뷰 'Wi-Fi가 약했다' + 이메일 '인터넷을 업그레이드했다'. 카누는 무료(B 함정), 청결은 칭찬(A).", "id": "t16-200", "w": "", "hit": false}]}, {"id": "t23-176", "kind": "Web page and e-mail", "tabs": [{"l": "Web page", "h": "<div class=\"url\">https://www.orchardvalleycc.com/venues<\/div><h4>Meeting Rooms at Orchard Valley<\/h4><p>Located just 15 minutes from Redmond International Airport, Orchard Valley Conference Center offers flexible spaces for meetings of every size. All rooms include high-speed Internet, a projector, and a sound system at no additional cost.<\/p><p>• <b>Maple Room<\/b>: seats 20 — $300 per day<\/p><p>• <b>Birch Room<\/b>: seats 60 — $650 per day<\/p><p>• <b>Cedar Hall<\/b>: seats 150 — $1,400 per day; includes a stage; minimum of 100 guests<\/p><p>• <b>Willow Terrace<\/b>: seats 80, outdoors — $900 per day; available May–September only<\/p><p>Meals can be arranged through our in-house kitchen. Groups that book a room for two or more consecutive days receive 10 percent off the room rate.<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> events@orchardvalleycc.com<\/div><div><b>From:<\/b> Hiroshi Tanaka<\/div><div><b>Date:<\/b> March 3<\/div><div><b>Subject:<\/b> Booking inquiry<\/div><\/div><p>Hello,<\/p><p>I am organizing a two-day training workshop for our regional sales team on April 15 and 16. We expect about 55 participants, and we would like everyone to be seated in a single room for the morning sessions. I had hoped to hold lunch outdoors, but I understand that may not be possible at that time of year.<\/p><p>Could you confirm whether the room I have in mind is available on those dates? I would also like to know whether your kitchen can <u>accommodate<\/u> guests with dietary restrictions, as several members of our team do not eat meat.<\/p><p>Thank you,<br/>Hiroshi Tanaka<br/>Lindell Pharmaceuticals<\/p>"}], "qs": [{"s": "What is indicated about all of the meeting rooms?", "o": ["They include a stage.", "They can seat more than 50 people.", "They have audiovisual equipment.", "They are next to an airport."], "a": 2, "n": "사실 확인: projector, sound system → 시청각 장비. 무대는 Cedar Hall만(A), 공항은 15분 거리(D).", "id": "t23-176", "w": "", "hit": false}, {"s": "Why did Mr. Tanaka write the e-mail?", "o": ["To cancel a reservation", "To request a refund", "To change the date of a workshop", "To ask about reserving a room"], "a": 3, "n": "목적: 방 예약 가능 여부 문의.", "id": "t23-177", "w": "", "hit": false}, {"s": "Which room will Mr. Tanaka most likely reserve?", "o": ["The Birch Room", "The Maple Room", "Cedar Hall", "Willow Terrace"], "a": 0, "n": "연계: 55명 → Maple(20) 부족. 4월 → Willow(5~9월) 불가. 55명에 맞는 가장 알맞은 실내 공간 → Birch(60). Cedar Hall은 최소 100명이라 불가.", "id": "t23-178", "w": "연계: 55명 + 4월(Willow는 5~9월) → Birch ← Willow Terrace", "hit": true}, {"s": "What is suggested about Mr. Tanaka's booking?", "o": ["It will include an outdoor lunch.", "It will qualify for a discount.", "It must be paid for in advance.", "It is for more than 100 people."], "a": 1, "n": "연계: 4월 15·16일 이틀 연속 → 10% 할인 조건. 야외 점심은 본인이 불가능하다고 인정(A).", "id": "t23-179", "w": "", "hit": false}, {"s": "In the e-mail, the word \"accommodate\" in paragraph 2 is closest in meaning to", "o": ["seat", "lend", "agree with", "provide for"], "a": 3, "n": "동의어: 식이 제한 손님을 '수용하다/맞춰 주다' → provide for. seat(앉히다)는 방 수용 인원과 섞은 함정.", "id": "t23-180", "w": "동의어: accommodate guests with dietary restrictions → provide for ← seat", "hit": true}]}, {"id": "t23-186", "kind": "advertisement, form, and e-mail", "tabs": [{"l": "advertisement", "h": "<h4>Saffron Table Catering<\/h4><p>From office lunches to wedding receptions, Saffron Table brings restaurant-quality food to your event. All of our menus can be adjusted for vegetarian, vegan, and gluten-free guests.<\/p><p><b>Our Packages<\/b><\/p><ul><li><b>Express Lunch<\/b>: sandwiches, salad, and dessert — $14 per person (minimum 10 guests)<\/li><li><b>Executive Buffet<\/b>: two hot main dishes, three sides, and dessert — $26 per person (minimum 25 guests)<\/li><li><b>Celebration Dinner<\/b>: plated three-course meal with servers — $48 per person (minimum 40 guests)<\/li><\/ul><p>Orders must be placed at least five business days in advance. Delivery is free within 20 kilometers of our kitchen in Fairmont.<\/p>"}, {"l": "form", "h": "<h4>Saffron Table Catering — Order Form<\/h4><p>Submitted: June 2<\/p><div class=\"tw\"><table><tr><th>Name<\/th><th>Elena Petrova<\/th><\/tr><tr><td>Company<\/td><td>Brightwater Analytics<\/td><\/tr><tr><td>Event date<\/td><td>June 13<\/td><\/tr><tr><td>Number of guests<\/td><td>30<\/td><\/tr><tr><td>Package<\/td><td>Executive Buffet<\/td><\/tr><tr><td>Delivery address<\/td><td>418 Kinsley Avenue, Fairmont<\/td><\/tr><tr><td>Special requests<\/td><td>Four guests are vegetarian. Please label all dishes.<\/td><\/tr><\/table><\/div>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> Elena Petrova<\/div><div><b>From:<\/b> Jamal Wright, Saffron Table Catering<\/div><div><b>Date:<\/b> June 8<\/div><div><b>Subject:<\/b> Your order for June 13<\/div><\/div><p>Dear Ms. Petrova,<\/p><p>Thank you for your order. I am writing because one of the main dishes in your package, roasted lemon chicken, will not be available on June 13, as our supplier cannot deliver the ingredients that week. We would be happy to replace it with grilled salmon at no extra cost. Alternatively, you may choose any main dish from our Celebration Dinner menu for an additional $4 per person.<\/p><p>As you requested, all dishes will be clearly labeled, and we will prepare vegetarian portions for the guests you mentioned. Please let me know your choice by June 10 so that our kitchen has enough time to prepare.<\/p><p>Best regards,<br/>Jamal Wright<\/p>"}], "qs": [{"s": "What is indicated about Saffron Table Catering?", "o": ["It can change menus for guests with special diets.", "It charges for every delivery.", "It operates several restaurants.", "It requires payment five days in advance."], "a": 0, "n": "사실 확인: menus can be adjusted for vegetarian, vegan, and gluten-free → 특수 식단 대응. 5일 전은 '주문' 마감(D 함정).", "id": "t23-186", "w": "사실확인: 5일 전은 주문 마감(결제 아님) → 메뉴 조정 가능 ← requires payment", "hit": true}, {"s": "What is suggested about Ms. Petrova's order?", "o": ["It was placed too late.", "It meets the minimum number of guests.", "It will be delivered outside Fairmont.", "It includes servers."], "a": 1, "n": "연계: Executive Buffet 최소 25명 ↔ 주문 30명 → 충족. 6/2 주문 → 6/13 행사라 5영업일 이상(A 반대). 서빙 인력은 Celebration Dinner만(D).", "id": "t23-187", "w": "", "hit": false}, {"s": "Why did Mr. Wright write to Ms. Petrova?", "o": ["To confirm a delivery address", "To ask how many guests will attend", "To report that a dish is unavailable", "To request a deposit"], "a": 2, "n": "목적: 레몬 치킨을 6월 13일에 제공 못 함 → 메뉴 품절 안내.", "id": "t23-188", "w": "", "hit": false}, {"s": "If Ms. Petrova chooses a main dish from the Celebration Dinner menu, how much will her order cost per person?", "o": ["$26", "$30", "$48", "$52"], "a": 1, "n": "연계 계산: Executive Buffet $26 + 추가 $4 = $30. $48은 Celebration Dinner 패키지 가격(C 함정).", "id": "t23-189", "w": "", "hit": false}, {"s": "By what date must Ms. Petrova respond to Mr. Wright?", "o": ["June 8", "June 10", "June 13", "June 2"], "a": 1, "n": "세부: Please let me know your choice by June 10.", "id": "t23-190", "w": "", "hit": false}]}, {"id": "t38-176", "kind": "e-mail and notice", "tabs": [{"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> Rafael Moreno<\/div><div><b>From:<\/b> Northline Tech Summit Registration<\/div><div><b>Date:<\/b> August 19<\/div><div><b>Subject:<\/b> Registration confirmation #5512<\/div><\/div><p>Dear Mr. Moreno,<\/p><p>Thank you for registering for the Northline Tech Summit, which will be held September 24–26 at the Avery Convention Center. Your registration includes the following:<\/p><p>Full conference pass (3 days): $450<br/>Workshop: Cloud Security Basics (September 24, 2:00 P.M.): $60<br/>Total paid: $510<\/p><p>Your badge can be picked up at the registration desk in the main lobby starting at 8:00 A.M. on September 24. Please bring a photo ID. Lunch is provided each day for full-pass holders.<\/p><p>Northline Tech Summit Team<\/p>"}, {"l": "notice", "h": "<h4>Northline Tech Summit: Schedule Update<\/h4><p>Because of high demand, all afternoon workshops on September 24 have been moved from the Avery Convention Center to the Lindell Hotel, a five-minute walk away. Workshop times have not changed. Participants registered for these workshops may also collect their badges at the hotel's front desk from 1:00 P.M. on that day.<\/p><p>In addition, the opening keynote speech by Dr. Helen Cho will now begin at 9:30 A.M. instead of 9:00 A.M. We apologize for any inconvenience.<\/p>"}], "qs": [{"s": "What is the purpose of the e-mail?", "o": ["To confirm a registration", "To announce a change of venue", "To request a payment", "To recommend a workshop"], "a": 0, "n": "[불명확: 목적] 첫 문장 + 결제 내역 = 등록 확인. 장소 변경은 공지(지문 2) 내용.", "id": "t38-176", "w": "", "hit": false}, {"s": "What is indicated about Mr. Moreno?", "o": ["He will give a presentation.", "He paid $450 in total.", "He registered for more than one workshop at the summit.", "He will receive meals at the event."], "a": 3, "n": "[불명확] full conference pass + Lunch is provided for full-pass holders. 총액은 $510(숫자 바꿔치기).", "id": "t38-177", "w": "", "hit": false}, {"s": "What should participants bring to pick up their badges?", "o": ["A printed confirmation", "A credit card", "A workshop ticket", "Identification"], "a": 3, "n": "[명확] 주관식 답: photo ID → Identification(패러프레이징).", "id": "t38-178", "w": "", "hit": false}, {"s": "Where will Mr. Moreno most likely attend his workshop?", "o": ["At the Avery Convention Center", "At the registration desk", "In the main lobby", "At the Lindell Hotel"], "a": 3, "n": "[명확 + 연계] 지문 1의 피자 꼬투리: 워크숍 9/24 2:00 P.M. → 공지: 9/24 오후 워크숍은 Lindell Hotel로 이동.", "id": "t38-179", "w": "", "hit": false}, {"s": "According to the notice, what has changed about the keynote speech?", "o": ["Its starting time", "The building where it will take place", "Its speaker", "Its length"], "a": 0, "n": "[명확] 9:00 → 9:30 A.M. 시작 시각만 바뀜.", "id": "t38-180", "w": "", "hit": false}]}, {"id": "t38-186", "kind": "article, e-mail, and Web page", "tabs": [{"l": "article", "h": "<h4>Riverbend to Rent Garden Plots<\/h4><p>RIVERBEND (February 20)—The Riverbend Parks Department will rent out 40 garden plots at Elm Park beginning April 1. Small plots (3 x 3 meters) will cost $25 per season, and large plots (3 x 6 meters) will cost $40. Residents of Riverbend will receive a 20 percent discount.<\/p><p>Applications will be accepted from March 1 to March 15. If more applications are received than there are plots, plots will be assigned by lottery. Water and basic gardening tools will be provided, but gardeners must supply their own seeds and plants.<\/p><p>\"Many residents live in apartment buildings and have no space to grow vegetables,\" said parks director Tomas Reyes. \"This program gives them that opportunity.\"<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> parks@riverbend.gov<\/div><div><b>From:<\/b> Grace Lin<\/div><div><b>Date:<\/b> March 27<\/div><div><b>Subject:<\/b> Garden plot<\/div><\/div><p>Dear Parks Department,<\/p><p>Thank you for letting me know that I was given a large plot at Elm Park. I have lived in Riverbend for six years, and I am excited to start growing my own vegetables.<\/p><p>I have two questions. First, my friend Sara Patel, who lives in neighboring Ashford, would like to help me with the plot. Is that allowed? Second, I have some tools of my own that I would like to keep at the garden. Is there a place to store them there?<\/p><p>Grace Lin<\/p>"}, {"l": "Web page", "h": "<div class=\"url\">https://www.riverbend.gov/parks/elm-garden<\/div><h4>Elm Park Community Garden: Large Plot Assignments<\/h4><div class=\"tw\"><table><tr><th>Plot<\/th><th>Gardener<\/th><th>Location<\/th><\/tr><tr><td>L-1<\/td><td>Grace Lin<\/td><td>Next to storage shed<\/td><\/tr><tr><td>L-2<\/td><td>Owen Briggs<\/td><td>North fence<\/td><\/tr><tr><td>L-3<\/td><td>Maria Santos<\/td><td>Near water tap<\/td><\/tr><tr><td>L-4<\/td><td>Daniel Kwon<\/td><td>South gate<\/td><\/tr><\/table><\/div><p>Gardeners may bring guests to help with their plots at any time. Storage lockers next to the shed can be rented for $10 per season; contact the Parks Department to reserve one.<\/p>"}], "qs": [{"s": "What is the purpose of the article?", "o": ["To report the results of a lottery", "To announce a new program for residents", "To introduce a new parks director", "To explain changes to park hours"], "a": 1, "n": "[불명확: 목적] 첫 문단 = 텃밭 임대 시작 안내. 추첨 결과는 아직 나오기 전.", "id": "t38-186", "w": "", "hit": false}, {"s": "According to the article, what will gardeners need to provide?", "o": ["Seeds", "Water", "Tools", "Fencing"], "a": 0, "n": "[명확] 주관식 답: must supply their own seeds and plants → Seeds. 물·도구는 제공됨.", "id": "t38-187", "w": "", "hit": false}, {"s": "How much will Ms. Lin most likely pay for her plot?", "o": ["$20", "$25", "$32", "$40"], "a": 2, "n": "[명확 + 연계 1] 숫자정보: 큰 텃밭 $40 + 주민 20% 할인(기사) × 이메일 'large plot', 'lived in Riverbend for six years' → $32.", "id": "t38-188", "w": "", "hit": false}, {"s": "What is suggested about Ms. Patel?", "o": ["She applied for a small plot.", "She does not live in Riverbend.", "She works for the Parks Department.", "She has grown vegetables for six years."], "a": 1, "n": "[불명확] who lives in neighboring Ashford → 리버벤드 주민 아님. six years는 Ms. Lin(대상 바꿔치기).", "id": "t38-189", "w": "", "hit": false}, {"s": "What will Ms. Lin most likely do?", "o": ["Reserve a storage locker", "Move to a plot near the water tap", "Apply for a second plot", "Buy tools from the Parks Department"], "a": 0, "n": "[명확 + 연계 2] 이메일: 도구 보관 장소 질문 → 웹페이지: shed 옆 보관함 $10, 예약은 Parks Department. 그녀 텃밭 L-1도 shed 옆.", "id": "t38-190", "w": "", "hit": false}]}, {"id": "t39-176", "kind": "article and letter", "tabs": [{"l": "article", "h": "<h4>Make Your Commute Work for You<\/h4><p><i>Midlands Commuter<\/i> — June issue<\/p><p>For many of us, the daily trip to work means crowded platforms, hard seats, and wasted time. A few simple changes, however, can turn those hours into a more pleasant part of the day.<\/p><p><b>Comfort<\/b><br/>• Carry a small cushion for long train rides.<br/>• Choose a seat away from the doors to avoid cold drafts.<\/p><p><b>Productivity<\/b><br/>• Save documents to your device before you leave home, since connections on trains are often unreliable.<br/>• Listen to recorded books or language lessons rather than reading on a screen.<\/p><p><b>Health<\/b><br/>• Get off one stop early and walk the rest of the way.<br/>• Bring a bottle of water, especially in summer.<\/p><p><b>Do you have a tip of your own? Send it to us, and we will print the best ones in our July issue.<\/b><\/p>"}, {"l": "letter", "h": "<p><b>Letters to the Editor<\/b><\/p><p>Your article on commuting described my mornings exactly. Your readers may like to know about the company I work for, Foldaway Ltd. We make equipment for people who work while they travel.<\/p><p>Our Slimline laptop stand, for example, weighs just 400 grams and folds flat enough to fit in a coat pocket. Our reading light clips onto any seat and runs for ten hours on one charge. New products are added to our online shop every season.<\/p><p>Rina Voss<\/p>"}], "qs": [{"s": "What is NOT recommended in the article?", "o": ["Buying a monthly pass", "Sitting away from the doors", "Walking part of the way", "Listening to recorded lessons"], "a": 0, "n": "[불명확: NOT] 선지 4개 ✓✗. 정기권은 언급 없음. 나머지는 표현만 바뀜(Get off one stop early and walk → Walking part of the way). (T1-176)", "id": "t39-176", "w": "", "hit": false}, {"s": "Why are unreliable connections mentioned?", "o": ["To recommend a different train line", "To warn readers about delays on certain train lines", "To suggest working at home", "To explain why files should be saved in advance"], "a": 3, "n": "[명확] since connections ~ are often unreliable = 문서를 미리 저장하라는 이유.", "id": "t39-177", "w": "", "hit": false}, {"s": "What is indicated about the magazine?", "o": ["It is handed out free of charge on trains.", "It is published by a railway company.", "It will stop printing after the July issue.", "It plans to publish suggestions from readers."], "a": 3, "n": "[불명확] 맨 아래 굵은 줄: Send it to us, we will print the best ones → 독자 의견 게재. (T1-178)", "id": "t39-178", "w": "", "hit": false}, {"s": "What is suggested about Ms. Voss?", "o": ["She writes professionally for travel magazines.", "She read a recent issue of the magazine.", "She founded Foldaway Ltd.", "She works from home."], "a": 1, "n": "[불명확 + 연계] 편지 'Your article on commuting' ↔ 기사(6월호). work for는 직원이지 창업자가 아님.", "id": "t39-179", "w": "", "hit": false}, {"s": "What is suggested about Foldaway Ltd.'s products?", "o": ["They are inexpensive.", "They are easy to carry.", "They are sold only in summer.", "They are made from recycled materials."], "a": 1, "n": "[불명확] 400 grams + fit in a coat pocket → 휴대하기 쉬움. (T1-180)", "id": "t39-180", "w": "", "hit": false}]}, {"id": "t39-186", "kind": "order confirmation, notice, and e-mail", "tabs": [{"l": "order confirmation", "h": "<h4>Linden Arts Center — Order Confirmation for Mr. Paul Reyes<\/h4><p>Thank you for registering for Dana Okafor's workshop on March 9. We are glad that you chose to order some of Ms. Okafor's gardening guides at the member price. Your books will be waiting for you at the registration table on the day of the workshop, where payment can be made by credit card.<\/p><div class=\"tw\"><table><tr><th>Qty<\/th><th>Title<\/th><th>Price<\/th><th>Member price<\/th><th>Total<\/th><\/tr><tr><td>1<\/td><td>Small Spaces, Big Harvests: Growing Vegetables on a Balcony<\/td><td>$20.00<\/td><td>$15.00<\/td><td>$15.00<\/td><\/tr><tr><td>1<\/td><td>Soil Basics<\/td><td>$16.00<\/td><td>$12.00<\/td><td>$12.00<\/td><\/tr><tr><td>1<\/td><td>Pruning Fruit Trees<\/td><td>$24.00<\/td><td>$18.00<\/td><td>$18.00<\/td><\/tr><tr><td>2<\/td><td>A Year of Herbs<\/td><td>$12.00<\/td><td>$9.00<\/td><td>$18.00<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><b>Total due<\/b><\/td><td><b>$63.00<\/b><\/td><\/tr><\/table><\/div>"}, {"l": "notice", "h": "<h4>Attention, Workshop Participants<\/h4><p>We are sorry to report that copies of <i>Soil Basics<\/i> did not arrive in time for today's workshop. If you ordered this title, please leave your mailing address with the staff member at the registration table. The book will be sent to your home at no cost to you, and your credit card will be charged when it ships.<\/p>"}, {"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> Lena Fischer<\/div><div><b>From:<\/b> Paul Reyes<\/div><div><b>Date:<\/b> March 20<\/div><div><b>Subject:<\/b> Okafor book<\/div><\/div><p>Hi Lena,<\/p><p>I am looking forward to finishing our plan for the café's rooftop garden. Before we order any plants, though, I would like to rethink where the containers will go. Have you had a chance to look at the Okafor book I lent you? She gives const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};

const stat=(items)=>{let done=0,ok=0,bad=[];items.forEach(it=>{const r=REC[it.q.id];if(r){done++;if(r[2])ok++;else bad.push(it)}});return{done,ok,bad}};
function home(){
  app.innerHTML='';window.scrollTo(0,0);
  const all=decks();const tot=stat(all.flatMap(d=>d.items));
  app.append($(`<div><h1>동하 오답 퀴즈</h1><p class="sub">틀렸던 문제와 같은 유형을 폰으로 다시 푸는 곳. 푼 문제 ${tot.done}개, 마지막 시도 기준 정답 ${tot.ok}개.</p></div>`));
  let sec='';
  all.forEach(d=>{
    const part=d.title.split(' · ')[0];
    if(part!==sec){sec=part;app.append($(`<h2>${part}</h2>`))}
    const s=stat(d.items);const pct=d.items.length?Math.round(s.done/d.items.length*100):0;
    const el=$(`<div class="deck"><div class="i"><b>${d.title.split(' · ')[1]}</b><small>${d.items.length}문항 · ${d.desc}</small><div class="bar"><i style="width:${pct}%"></i></div><small>푼 것 ${s.done} · 정답 ${s.ok} · 다시 볼 것 ${s.bad.length}</small></div><div class="b"><button class="btn">풀기</button><button class="btn g" ${s.bad.length?'':'disabled'}>틀린 것</button></div></div>`);
    const [b1,b2]=el.querySelectorAll('button');
    b1.onclick=()=>run(d,d.items[0].set?d.items:shuffle(d.items));
    b2.onclick=()=>run(d,s.bad);
    app.append(el);
  });
  const rs=$(`<div class="deck"><div class="i"><b>기록 지우기</b><small>이 기기에 저장된 풀이 기록을 지워. 다른 기기와는 공유되지 않아.</small></div><div class="b"><button class="btn g" id="rs">지우기</button></div></div>`);
  let armed=false;rs.querySelector('button').onclick=(e)=>{if(!armed){armed=true;e.target.textContent='한 번 더';return}REC={};save();home()};
  app.append(rs);
}
function run(deck,items){
  let i=0,right=0,tab=0,curSet=null;
  function show(){
    app.innerHTML='';
    if(i>=items.length){
      app.append($(`<div class="q done"><div class="n">${right} / ${items.length}</div><p class="sub">${deck.title}</p><div class="nav"><button class="btn" id="h">처음으로</button></div></div>`));
      app.querySelector('#h').onclick=home;window.scrollTo(0,0);return}
    const it=items[i],q=it.q,s=it.set;
    const top=$(`<div class="top"><button class="btn g" id="x">나가기</button><div class="t">${deck.title} · ${i+1}/${items.length}</div></div>`);
    top.querySelector('#x').onclick=home;app.append(top);
    if(s){
      if(s!==curSet){curSet=s;tab=0}
      if(s.tabs.length>1){const tb=$('<div class="tabs" role="tablist"></div>');s.tabs.forEach((t,k)=>{const b=$(`<button role="tab" aria-selected="${k===tab}">${k+1}. ${t.l}</button>`);b.onclick=()=>{tab=k;ps.innerHTML=s.tabs[k].h;ps.scrollTop=0;tb.querySelectorAll('button').forEach((x,m)=>x.setAttribute('aria-selected',m===k))};tb.append(b)});app.append(tb)}
      var ps=$('<div class="pass"></div>');ps.innerHTML=s.tabs[tab].h;app.append(ps);
    }
    const card=$(`<div class="q"><div class="m">${q.hit||(!s&&q.w)?'<span class="star">★ 틀렸던 문제</span>':''}<span>${q.id}${q.t?' · '+q.t:''}</span></div><p class="s"></p><div class="opts"></div></div>`);
    card.querySelector('.s').innerHTML=q.s;
    const box=card.querySelector('.opts');
    q.o.forEach((o,k)=>{const b=$(`<button><span class="l">${'ABCD'[k]}</span><span></span></button>`);b.lastElementChild.innerHTML=o;
      b.onclick=()=>{
        const ok=k===q.a;if(ok)right++;
        const r=REC[q.id]||[0,0,0];r[ok?0:1]++;r[2]=ok?1:0;REC[q.id]=r;save();
        box.querySelectorAll('button').forEach((x,m)=>{x.disabled=true;if(m===q.a)x.classList.add('ok');else if(m===k)x.classList.add('no')});
        const ex=$(`<div class="ex"><div class="r ${ok?'ok':'no'}">${ok?'정답':'오답'} · 정답 ${'ABCD'[q.a]}</div><div class="n"></div>${q.w?'<div class="w"></div>':''}<div class="nav"><button class="btn">${i+1<items.length?'다음':'결과 보기'}</button></div></div>`);
        ex.querySelector('.n').textContent=q.n;if(q.w)ex.querySelector('.w').textContent='예전에 틀린 이유: '+q.w;
        ex.querySelector('button').onclick=()=>{i++;show()};card.append(ex);ex.scrollIntoView({block:'nearest',behavior:'smooth'});
      };box.append(b)});
    app.append(card);if(!s)window.scrollTo(0,0);
  }
  show();
}
