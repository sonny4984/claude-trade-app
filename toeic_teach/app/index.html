1-138", "w": "memorable ← memorizing 선택. 감정분사 규칙을 감정동사 아닌 memorize에 잘못 적용", "hit": true}]}, {"id": "t16-135", "kind": "article", "tabs": [{"l": "article", "h": "<h4>Dunmore Theater Reopens After Restoration<\/h4><p>DUNMORE (March 12)—After nearly two years of restoration work, the historic Dunmore Theater will reopen to the public on April 5. The 1920s building had been closed since its roof was damaged in a storm.<\/p><p>The restoration was paid for largely by local residents, <b class=\"bl\">__135__<\/b> donated more than $1.2 million. <b class=\"bl\">__136__<\/b> Workers repaired the original ceiling paintings, replaced all 600 seats, and installed a modern sound system.<\/p><p>The first performance will be a concert by the Dunmore Symphony Orchestra. Tickets <b class=\"bl\">__137__<\/b> on sale at the box office next Monday. Theater director Carla Voss said the theater will also host film screenings and community events. \"We want it to be a place for <b class=\"bl\">__138__<\/b>, not just for people who enjoy classical music,\" she said.<\/p>"}], "qs": [{"s": "빈칸 135", "o": ["whose", "which", "whom", "who"], "a": 3, "n": "관계대명사: 콤마 + 사람 선행사(residents) + 주어 없는 절(donated) → 주격 who. whose는 뒤에 명사, which는 사물, whom은 목적격.", "id": "t16-135", "w": "", "hit": false}, {"s": "빈칸 136", "o": ["The theater first opened in 1925 with a silent film.", "Ms. Voss will become the theater's director next year.", "The storm also damaged several nearby shops.", "The rest came from a state grant for historic buildings."], "a": 3, "n": "문장 고르기: 앞 문장 '대부분(largely) 주민이 냈다' → 나머지(The rest) 출처로 이어지는 흐름. (A)·(C)는 주제는 맞지만 비용 이야기 중간에 끼면 흐름이 끊김. (B)는 뒤 문단에서 이미 현 director로 나옴 → 모순.", "id": "t16-136", "w": "P6 문장고르기: largely(대부분) → The rest(나머지) 연결 못 봄, 주제만 맞는 오답(storm) 선택 / 오답모음 재풀이 정답", "hit": true}, {"s": "빈칸 137", "o": ["went", "have gone", "will go", "were going"], "a": 2, "n": "시제: next Monday(미래) → will go. go on sale(판매를 시작하다).", "id": "t16-137", "w": "", "hit": false}, {"s": "빈칸 138", "o": ["anyone", "each other", "one another", "everyone"], "a": 3, "n": "대명사 어휘: '클래식 좋아하는 사람만이 아니라 모두를 위한 곳' → everyone. anyone은 의문·부정·조건문에서 주로 씀.", "id": "t16-138", "w": "", "hit": false}]}, {"id": "t16-139", "kind": "notice", "tabs": [{"l": "notice", "h": "<h4>Notice to Customers<\/h4><p>Mason Street Pharmacy is changing the way prescriptions are filled. Starting May 1, customers can request refills through our mobile app or Web site <b class=\"bl\">__139__<\/b> of calling the store.<\/p><p>Once a refill is ready, you will receive a text message. Prescriptions will be held at the pharmacy counter for seven days. <b class=\"bl\">__140__<\/b> Customers who prefer not to use the app may continue to call us, <b class=\"bl\">__141__<\/b> wait times on the phone may be longer during busy hours.<\/p><p>We believe this change will allow our pharmacists to spend more time <b class=\"bl\">__142__<\/b> customers' questions in person. Thank you for your understanding.<\/p>"}], "qs": [{"s": "빈칸 139", "o": ["instead", "rather", "except", "apart"], "a": 0, "n": "숙어: instead of + 명사/V-ing(~ 대신에). rather than이면 가능하지만 rather of는 없음. except/apart는 for/from과 짝.", "id": "t16-139", "w": "", "hit": false}, {"s": "빈칸 140", "o": ["After that, they will be delivered to your home.", "Before that, you must pay a holding fee.", "During that time, the pharmacy will be closed.", "After that, they will be returned to stock."], "a": 3, "n": "문장 고르기: 7일 보관 → 그 뒤에는 재고로 돌린다. 네 선지 모두 '7일'을 that으로 받지만 (A)는 '찾으러 오는 방식'과 모순, (B)는 근거 없는 수수료, (C)는 약국이 7일간 닫는다는 뜻이라 모순.", "id": "t16-140", "w": "오답모음 재풀이: 7일 보관 뒤 → 재고로 반환(C) ← 배송(A)", "hit": true}, {"s": "빈칸 141", "o": ["unless", "so that", "in case", "although"], "a": 3, "n": "접속사: 앱 대신 전화해도 된다 ↔ 대기 시간이 길 수 있다(양보) → although. unless(~하지 않으면)·so that(목적)은 의미 불가.", "id": "t16-141", "w": "although(양보) ← in case 선택. Test G 113에 이어 in case 의미 혼동 2회째 / 오답모음 재풀이: although ← in case (3회째!)", "hit": true}, {"s": "빈칸 142", "o": ["answer", "answering", "answered", "to answer"], "a": 1, "n": "동명사: spend + 시간 + V-ing → spend more time answering. spend time to V는 쓰지 않음.", "id": "t16-142", "w": "spend time V-ing ← to answer 선택 / 오답모음 재풀이 정답", "hit": true}]}, {"id": "t23-131", "kind": "e-mail", "tabs": [{"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> All Staff<\/div><div><b>From:<\/b> Martin Osei, Facilities Manager<\/div><div><b>Date:<\/b> March 3<\/div><div><b>Subject:<\/b> Parking garage maintenance<\/div><\/div><p>Dear staff,<\/p><p>The Elm Street parking garage will undergo scheduled maintenance from March 16 to 20. Crews will repaint the parking lines and repair the lighting on the lower levels. <b class=\"bl\">__131__<\/b> the work requires heavy equipment, the garage will be closed to all vehicles. <b class=\"bl\">__132__<\/b><\/p><p>Employees who normally park in the garage may use the Harbor Avenue lot, which is a ten-minute walk from the office. A shuttle bus will run between the lot and our main entrance every fifteen minutes from 7 A.M. to 7 P.M. Please note that spaces in the Harbor Avenue lot are limited, so we <b class=\"bl\">__133__<\/b> employees to share rides whenever possible.<\/p><p>We appreciate your <b class=\"bl\">__134__<\/b> while this important work is carried out.<\/p>"}], "qs": [{"s": "빈칸 131", "o": ["Therefore", "Despite", "Because", "Instead"], "a": 2, "n": "접속사 자리: 뒤에 절 두 개가 콤마로 이어짐 → 종속접속사 Because. Therefore/Instead는 부사라 두 절을 못 묶고, Despite는 전치사.", "id": "t23-131", "w": "", "hit": false}, {"s": "빈칸 132", "o": ["The new lighting has already made the garage much safer.", "Vehicles left in the garage after March 15 will be moved at the owner's expense.", "The shuttle bus service will be discontinued next month.", "Parking permits for the garage can be purchased online."], "a": 1, "n": "문장 고르기: 앞 '공사 기간 차량 전면 통제' → 그 전에 차를 빼라는 경고. (A)는 공사 전인데 already(완료) → 시제 모순, (C)는 뒤에서 셔틀 운행 안내 → 모순, (D)는 폐쇄 안내 중 주차권 구매는 흐름 이탈.", "id": "t23-132", "w": "", "hit": false}, {"s": "빈칸 133", "o": ["insist", "consider", "encourage", "agree"], "a": 2, "n": "동사 구조: ___ + 목적어(employees) + to V → encourage. insist는 on, consider는 V-ing, agree는 to V(목적어 없이).", "id": "t23-133", "w": "P6 동사 구조: encourage + O + to V ← insist", "hit": true}, {"s": "빈칸 134", "o": ["effort", "patience", "expense", "attendance"], "a": 1, "n": "명사 어휘: 공사 불편을 겪는 직원에게 '인내'에 감사 → patience. appreciate your patience는 공지문 마무리 표현.", "id": "t23-134", "w": "", "hit": false}]}, {"id": "t26-131", "kind": "e-mail", "tabs": [{"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> All Customer Service Staff<\/div><div><b>From:<\/b> Nadia Petrov, Customer Service Director<\/div><div><b>Date:<\/b> September 8<\/div><div><b>Subject:<\/b> New request-tracking system<\/div><\/div><p>Our current system for tracking customer requests has become difficult to use as our client base has grown. Starting on September 21, all requests will be logged in HelpPoint, a new platform that <b class=\"bl\">__131__<\/b> assigns each request to the appropriate department. <b class=\"bl\">__132__<\/b><\/p><p>To help everyone prepare, the IT department will hold two training sessions next week. Each two-hour session will cover the platform's basic features. We strongly <b class=\"bl\">__133__<\/b> all staff to attend one of them, even if you have used similar software before.<\/p><p>During the first month, IT staff will visit each department to answer questions. <b class=\"bl\">__134__<\/b>, technical problems with the platform should be reported directly to the IT help desk at extension 4420.<\/p>"}], "qs": [{"s": "빈칸 131", "o": ["automatic", "automatically", "automate", "automation"], "a": 1, "n": "부사 자리: 관계사 that + ___ + 동사(assigns) → 동사를 꾸미는 부사 automatically.", "id": "t26-131", "w": "", "hit": false}, {"s": "빈칸 132", "o": ["Many customers have already praised the new system.", "This should significantly reduce the time customers spend waiting for a response.", "The training sessions were well attended last week.", "Our client base has decreased over the past year."], "a": 1, "n": "문장 고르기: 앞 '요청을 담당 부서로 자동 배정' → 그 효과(대기 시간 감소). (A)는 아직 도입 전(9월 21일)이라 시제 모순, (C)는 교육이 '다음 주', (D)는 앞의 has grown과 모순.", "id": "t26-132", "w": "P6 문장삽입(2번째): 자동 배정 → 효과(응답 대기 시간 감소). 아직 도입 전이면 already·과거시제 선지 탈락", "hit": true}, {"s": "빈칸 133", "o": ["suggest", "insist", "propose", "advise"], "a": 3, "n": "동사 구조: ___ + 목적어(all staff) + to V → advise. suggest/propose는 that절이나 V-ing, insist는 on. (TEST 23 133 encourage와 같은 구조)", "id": "t26-133", "w": "", "hit": false}, {"s": "빈칸 134", "o": ["Therefore", "Similarly", "However", "For instance"], "a": 2, "n": "접속부사: IT 직원이 부서를 돌며 '사용법 질문'에 답함 ↔ '기술 문제'는 헬프데스크로 따로 → 대조 However.", "id": "t26-134", "w": "", "hit": false}]}, {"id": "t26-139", "kind": "notice", "tabs": [{"l": "notice", "h": "<h4>Maple Grove Community Garden — Plots Available<\/h4><p>The Maple Grove Community Garden has a limited number of plots available for the upcoming growing season. Each plot measures 3 by 6 meters and comes with access to shared tools, a water supply, and a compost area. The annual fee is $40, which covers the cost of water and the general <b class=\"bl\">__139__<\/b> of the garden.<\/p><p>Plots will be assigned in the order in which applications are received. <b class=\"bl\">__140__<\/b> demand has been high in recent years, we encourage interested residents to apply as early as possible. Gardeners are expected to keep their plots free of weeds and to attend at least two of the four volunteer workdays held during the season. Those who fail to meet these <b class=\"bl\">__141__<\/b> may not be offered a plot the following year.<\/p><p><b class=\"bl\">__142__<\/b><\/p>"}], "qs": [{"s": "빈칸 139", "o": ["maintenance", "maintain", "maintained", "maintainable"], "a": 0, "n": "명사 자리: the general + ___ + of → 명사 maintenance.", "id": "t26-139", "w": "", "hit": false}, {"s": "빈칸 140", "o": ["Despite", "Therefore", "Because", "Moreover"], "a": 2, "n": "접속사 자리: 뒤에 절 두 개가 콤마로 연결 → 종속접속사 Because. Therefore/Moreover는 부사, Despite는 전치사.", "id": "t26-140", "w": "", "hit": false}, {"s": "빈칸 141", "o": ["opportunities", "requirements", "deadlines", "preferences"], "a": 1, "n": "명사 어휘: 앞 문장의 '잡초 관리 + 봉사일 2회 참석'(지켜야 할 조건) → requirements. fail to meet + requirements 연어.", "id": "t26-141", "w": "", "hit": false}, {"s": "빈칸 142", "o": ["Volunteer workdays are optional for all gardeners.", "Application forms can be picked up at the Maple Grove Library or downloaded from our Web site.", "Plots are assigned by a lottery held in March.", "Gardeners must bring their own tools, as none are provided."], "a": 1, "n": "문장 고르기(마지막): 공지 마무리 = 신청서 받는 곳 안내. (A)는 '최소 2회 참석'과 모순, (C)는 '접수 순서대로 배정'과 모순, (D)는 '공용 도구 제공'과 모순.", "id": "t26-142", "w": "P6 문장삽입(마지막): 공지 마무리 = 신청서 받는 곳. 지문 내용과 모순되는 선지(추첨·도구 지참·봉사일 선택) 탈락", "hit": true}]}, {"id": "t33-143", "kind": "e-mail", "tabs": [{"l": "e-mail", "h": "<div class=\"hdr\"><div><b>To:<\/b> All Sales Staff<\/div><div><b>From:<\/b> Ines Carvalho<\/div><div><b>Date:<\/b> November 2<\/div><div><b>Subject:<\/b> Expense reports<\/div><\/div><p>Beginning December 1, expense reports must be submitted through the Paywise app rather than on paper. The app allows you to photograph receipts with your phone, so you will no longer need to keep the originals. <b class=\"bl\">__143__<\/b>, reports submitted through the app are typically reimbursed within five business days, compared with two weeks for paper reports.<\/p><p>A training video is available on the company intranet. <b class=\"bl\">__144__<\/b> who still have questions after watching it may contact Mr. Patel in the finance department. Paper reports will still be accepted <b class=\"bl\">__145__<\/b> November 30. <b class=\"bl\">__146__<\/b><\/p>"}], "qs": [{"s": "빈칸 143", "o": ["Instead", "Otherwise", "Even so", "In addition"], "a": 3, "n": "접속부사: 원본 보관 불필요 + '게다가' 환급도 빠름 → In addition(장점 추가).", "id": "t33-143", "w": "Even so = 그렇긴 해도(역접), 심지어 아님. ➕➕ → In addition (Even so 고름)", "hit": true}, {"s": "빈칸 144", "o" (although 고름)", "hit": true}, {"s": "빈칸 133", "o": ["Our technicians are available seven days a week.", "This rate will be guaranteed for the next two years.", "Your first bill was issued five years ago.", "Many of our customers now work from home."], "a": 1, "n": "문장 고르기: 앞 '현재 요금으로 갱신' → This rate로 받아 '2년간 보장'. 뒤 also(추가 혜택)와도 이어짐.", "id": "t37-133", "w": "문장 삽입: 앞 문장의 This rate가 받는 것 = 요금 보장. 주제만 같은 선지(재택근무 고객) 고름", "hit": true}, {"s": "빈칸 134", "o": ["standard", "reduced", "annual", "temporary"], "a": 0, "n": "문맥 어휘: 갱신하지 않으면 → (인상된) '표준' 요금 적용. month-to-month라 annual 불가, 혜택이 없으니 reduced 불가.", "id": "t37-134", "w": "", "hit": false}]}, {"id": "t37-135", "kind": "advertisement", "tabs": [{"l": "advertisement", "h": "<h4>Northgate Fitness: Corporate Memberships<\/h4><p>Is your team spending too many hours sitting at a desk? Northgate Fitness now offers corporate membership plans <b class=\"bl\">__135__<\/b> for businesses with ten or more employees. Member companies enjoy discounted monthly rates, and their employees have unlimited access to all three of our locations. <b class=\"bl\">__136__<\/b> Our certified trainers can also visit your workplace to lead lunchtime exercise sessions.<\/p><p>Studies show that employees who exercise regularly take fewer sick days and report higher job satisfaction. <b class=\"bl\">__137__<\/b>, a corporate membership is an investment in your company's productivity. To request a <b class=\"bl\">__138__<\/b>, contact our corporate services team at 555-0127.<\/p>"}], "qs": [{"s": "빈칸 135", "o": ["designing", "designed", "design", "designs"], "a": 1, "n": "분사(꼬리): 진짜 동사는 offers → plans (that are) designed for ~.", "id": "t37-135", "w": "", "hit": false}, {"s": "빈칸 136", "o": ["Northgate Fitness was founded by two former athletes.", "Sick days are paid according to company policy.", "Each is open from 5:00 A.M. to 11:00 P.M. daily.", "Lunch is not included in the membership fee."], "a": 2, "n": "문장 고르기: 앞 'all three of our locations' → Each(각 지점)로 받아 운영 시간 안내.", "id": "t37-136", "w": "문장 삽입: all three of our locations → Each(각 지점) 운영 시간. Northgate 설립 이야기 고름", "hit": true}, {"s": "빈칸 137", "o": ["On the other hand", "Even so", "In other words", "For instance"], "a": 2, "n": "연결어: 운동하는 직원은 결근이 적고 만족도가 높다 → '다시 말해' 생산성에 대한 투자.", "id": "t37-137", "w": "", "hit": false}, {"s": "빈칸 138", "o": ["receipt", "quote", "refund", "reference"], "a": 1, "n": "문맥 어휘: 가입을 검토하는 기업이 요청하는 것 → 견적(quote). refund·receipt는 가입 후의 일.", "id": "t37-138", "w": "", "hit": false}]}, {"id": "t37-139", "kind": "memo", "tabs": [{"l": "memo", "h": "<div class=\"hdr\"><div><b>To:<\/b> All Staff<\/div><div><b>From:<\/b> Information Technology Department<\/div><div><b>Date:<\/b> April 27<\/div><div><b>Subject:<\/b> Password policy<\/div><\/div><p>Beginning Monday, May 4, all employees will be required to change their network passwords every 90 days. <b class=\"bl\">__139__<\/b> Passwords must contain at least twelve characters and may not be <b class=\"bl\">__140__<\/b> to any of your previous five passwords.<\/p><p>When your password is about to expire, you <b class=\"bl\">__141__<\/b> an automatic reminder by e-mail one week in advance. Employees who do not update their passwords by the deadline will be locked out of the network until they contact the help desk at extension 300. We recognize that this change may be inconvenient; <b class=\"bl\">__142__<\/b>, it is necessary to protect our clients' confidential information.<\/p>"}], "qs": [{"s": "빈칸 139", "o": ["The help desk is located on the second floor.", "This measure follows a recent increase in attempts to access company accounts.", "Many employees prefer to work remotely.", "New computers will be distributed next year."], "a": 1, "n": "문장 고르기: 앞 '90일마다 비밀번호 변경' → This measure(이 조치)로 받아 도입 이유 설명.", "id": "t37-139", "w": "문장 삽입: 90일마다 변경 → This measure(이 조치)가 도입 이유 설명. help desk 위치 고름", "hit": true}, {"s": "빈칸 140", "o": ["identity", "identical", "identically", "identify"], "a
