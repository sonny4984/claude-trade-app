<title>동하 오답 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one-column phone app. home = deck list, quiz = passage (tabs) + one question card at a time */
:root{--bg:#f3f5f4;--card:#ffffff;--fg:#17201d;--mut:#5d6b66;--line:#d6dedb;--acc:#0b6b5c;--acc-fg:#ffffff;--ok:#1f7a3d;--okbg:#e3f4e8;--no:#b3261e;--nobg:#fbe6e4;--star:#b7791f;--pass:#fbfcfb;
 --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--fe:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--card:#1a2220;--fg:#e8efec;--mut:#9aaaa4;--line:#2f3b38;--acc:#4fc3ad;--acc-fg:#06241f;--ok:#7fd69a;--okbg:#173524;--no:#ff9c94;--nobg:#3d1c19;--star:#e0b25a;--pass:#151c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101514;--card:#1a2220;--fg:#e8efec;--mut:#9aaaa4;--line:#2f3b38;--acc:#4fc3ad;--acc-fg:#06241f;--ok:#7fd69a;--okbg:#173524;--no:#ff9c94;--nobg:#3d1c19;--star:#e0b25a;--pass:#151c1a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;text-wrap:balance}h2{font-size:15px;margin:10px 0 0;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:13.5px;margin:0}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.deck{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.deck .i{flex:1 1 200px;min-width:0}.deck b{display:block;font-size:15.5px}.deck small{color:var(--mut);font-size:12.5px}
.deck .b{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--acc-fg);border:0;border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px}
.btn.g{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.35}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .t{flex:1;min-width:0;font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.pass{background:var(--pass);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--fe);font-size:16px;line-height:1.55;max-height:46vh;overflow-y:auto}
.pass.ko{font-family:var(--f);font-size:15px}
.pass h4{margin:0 0 8px;font-size:17px}.pass p{margin:0 0 9px}.pass .hdr{font-family:var(--f);font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:9px}
.pass .url{font-family:var(--f);font-size:12px;color:var(--mut);margin-bottom:6px;word-break:break-all}.pass .by{color:var(--mut);font-size:14px}
.pass .msg{font-family:var(--f);font-size:15px;border-top:1px solid var(--line);padding:7px 0}.pass .msg span{color:var(--mut);font-size:12.5px}
.pass .tw{overflow-x:auto;margin-bottom:9px}.pass table{border-collapse:collapse;font-family:var(--f);font-size:13.5px}.pass td,.pass th{border:1px solid var(--line);padding:4px 7px;text-align:left}
.pass .bl{font-family:var(--f);color:var(--acc)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.q .m{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}.star{color:var(--star);font-weight:700}
.q .s{font-family:var(--fe);font-size:17px;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--fe);font-size:16.5px;display:flex;gap:10px}
.opts button .l{font-family:var(--f);font-weight:700;color:var(--mut)}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}.opts button.no{border-color:var(--no);background:var(--nobg)}
.ex{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ex .n{white-space:pre-line;line-height:1.6}.ex .r{font-weight:800}.ex .r.ok{color:var(--ok)}.ex .r.no{color:var(--no)}.ex .w{color:var(--mut);font-size:13.5px}
.ex .k{background:var(--pass);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-line}
.ex label{font-size:13px;color:var(--mut);font-weight:600}
.ex textarea{width:100%;box-sizing:border-box;min-height:64px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:15px;resize:vertical}
.nav{display:flex;gap:8px}.nav .btn{flex:1}
.done{text-align:center;padding:26px 14px}.done .n{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}.note b{font-size:12.5px;color:var(--mut)}.note p{margin:4px 0 0;white-space:pre-line}
.pre{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.pre .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pre small{color:var(--mut);font-size:12.5px;width:100%}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13.5px}.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.opts.lock button{opacity:.45}.warn{color:var(--no);font-size:13.5px;font-weight:600}
.pad{position:relative}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3}.pad canvas[hidden]{display:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:4}.tools .chip{font-size:12.5px}
#sync{font-size:12px;color:var(--mut)}
</style>
<div id="app"></div>
<script>
const D=/*DATA*/;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// ---- state: REC[id]=[right,wrong,lastOk], NOTES[id]={t,at,ok}, SESS[deckKey]={ids,i,right}. local first, db when available
let ST={rec:{},notes:{},sess:{},at:0};
try{const o=JSON.parse(localStorage.getItem('dq2')||'null');if(o&&o.rec)ST=o;else{const old=JSON.parse(localStorage.getItem('dq1')||'null');if(old)ST.rec=old}}catch(e){}
let db=null,syncMsg='이 기기에만 저장 중',pushT=null,view='home';
const noteKey=id=>id.replace(/1000제/g,'RC1000').replace(/[^A-Za-z0-9_-]/g,'_');
function saveLocal(){ST.at=Date.now();try{localStorage.setItem('dq2',JSON.stringify(ST))}catch(e){}}
function save(){saveLocal();if(!db)return;clearTimeout(pushT);pushT=setTimeout(async()=>{try{await db.doc('state/main').set({json:JSON.stringify({rec:ST.rec,sess:ST.sess,hab:ST.hab||{}}),at:ST.at});setSync('계정에 저장됨')}catch(e){setSync('계정 저장 실패, 이 기기에는 저장됨')}},1200)}
async function saveNote(id){saveLocal();if(!db)return;const n=ST.notes[id];try{if(n&&n.t.trim())await db.doc('notes/'+noteKey(id)).set({id,text:n.t,at:n.at,lastCorrect:!!n.ok});else await db.doc('notes/'+noteKey(id)).delete();setSync('메모 저장됨')}catch(e){setSync('메모 계정 저장 실패, 이 기기에는 저장됨')}}
function setSync(m){syncMsg=m;const el=document.getElementById('sync');if(el)el.textContent=m}
(async()=>{try{
  db=await (window.claude&&window.claude.use?window.claude.use('db'):null);if(!db)return;
  const t=setTimeout(()=>setSync('계정 연결이 느려서 이 기기에만 저장 중'),10000);
  const snap=await db.doc('state/main').get();const ns=await db.collection('notes').get();clearTimeout(t);
  let changed=false;
  if(snap.exists){const d=snap.data();if((d.at||0)>ST.at){try{const o=JSON.parse(d.json);ST.rec=o.rec||{};ST.sess=o.sess||{};ST.hab=o.hab||ST.hab||{};ST.at=d.at;changed=true}catch(e){}}}
  ns.docs.forEach(x=>{const d=x.data();const cur=ST.notes[d.id];if(!cur||(d.at||0)>cur.at){ST.notes[d.id]={t:d.text,at:d.at||0,ok:!!d.lastCorrect};changed=true}});
  if(changed){try{localStorage.setItem('dq2',JSON.stringify(ST))}catch(e){}}
  setSync('계정에 저장됨');if(changed&&view==='home')home();
}catch(e){db=null;setSync('이 기기에만 저장 중')}})();

function decks(){
  const sets0=(arr)=>arr.flatMap(s=>s.qs.map(q=>({q,set:s})));
  const d=[];
  if(D.o_p5){d.push({key:'o5',title:'책 원문 오답 · Part 5',desc:'형 책에서 틀린 문제 그대로',items:D.o_p5.map(q=>({q}))});
    d.push({key:'o6',title:'책 원문 오답 · Part 6',desc:'틀린 문제가 있던 세트',items:sets0(D.o_p6)});
    d.push({key:'o7s',title:'책 원문 오답 · Part 7 단일지문',desc:'★가 형이 틀린 문제',items:sets0(D.o_p7s)});
    d.push({key:'o7m',title:'책 원문 오답 · Part 7 이중·삼중지문',desc:'★가 형이 틀린 문제',items:sets0(D.o_p7m)})}
  d.push({key:'p5m',title:'Part 5 · 내 오답',desc:'형이 틀린 문제 + 변형',items:D.p5_mine.map(q=>({q}))});
  D.p5_type.forEach((t,i)=>d.push({key:'p5t'+i,title:'Part 5 · '+t.name,desc:t.algo,items:t.qs.map(q=>({q}))}));
  d.push({key:'p6',title:'Part 6 · 내 오답 세트',desc:'시제 · 접속부사 · 문장삽입',items:sets0(D.p6)});
  d.push({key:'p7s',title:'Part 7 · 단일지문',desc:'명확은 주관식 답 먼저, 불명확은 선지 ✓✗',items:sets0(D.p7s)});
  d.push({key:'p7m',title:'Part 7 · 이중·삼중지문',desc:'지문 탭을 넘기며 꼬투리 연계',items:sets0(D.p7m)});
  return d;
}
const stat=(items)=>{let done=0,ok=0,bad=[];items.forEach(it=>{const r=ST.rec[it.q.id];if(r){done++;if(r[2])ok++;else bad.push(it)}});return{done,ok,bad}};
function home(){
  view='home';app.innerHTML='';window.scrollTo(0,0);
  const all=decks();const tot=stat(all.flatMap(d=>d.items));const nn=Object.values(ST.notes).filter(n=>n.t&&n.t.trim()).length;
  const H=Object.values(ST.hab||{});const fastBad=H.filter(h=>!h.ok&&h.sec<15).length,sureBad=H.filter(h=>!h.ok&&h.c==='O').length;
  app.append($(`<div><h1>동하 오답 퀴즈</h1><p class="sub">푼 문제 ${tot.done}개, 마지막 시도 기준 정답 ${tot.ok}개. <span id="sync">${syncMsg}</span></p>${H.length?`<p class="sub">습관 기록: 확신(O)했는데 틀림 <b>${sureBad}</b> · 15초 안에 고르고 틀림 <b>${fastBad}</b> · 판정 후 푼 문제 ${H.length}</p>`:''}</div>`));
  const nd=$(`<div class="deck"><div class="i"><b>내가 적은 틀린 이유</b><small>메모 ${nn}개. 모아 보고 한 번에 복사할 수 있어.</small></div><div class="b"><button class="btn g">모아 보기</button></div></div>`);
  nd.querySelector('button').onclick=notesView;app.append(nd);
  let sec='';
  all.forEach(d=>{
    const part=d.title.split(' · ')[0];
    if(part!==sec){sec=part;app.append($(`<h2>${part}</h2>`))}
    const s=stat(d.items);const pct=d.items.length?Math.round(s.done/d.items.length*100):0;
    const se=ST.sess[d.key];const live=se&&se.i<se.ids.length&&se.i>0;
    const el=$(`<div class="deck"><div class="i"><b>${d.title.split(' · ')[1]}</b><small>${d.items.length}문항 · ${d.desc}</small><div class="bar"><i style="width:${pct}%"></i></div><small>푼 것 ${s.done} · 정답 ${s.ok} · 다시 볼 것 ${s.bad.length}</small></div><div class="b"><button class="btn">${live?`이어 풀기 ${se.i+1}/${se.ids.length}`:'풀기'}</button>${live?'<button class="btn g">처음부터</button>':''}<button class="btn g" ${s.bad.length?'':'disabled'}>틀린 것</button></div></div>`);
    const bs=el.querySelectorAll('button');const byId=Object.fromEntries(d.items.map(it=>[it.q.id,it]));
    const fresh=()=>{const items=d.items[0].set?d.items:shuffle(d.items);ST.sess[d.key]={ids:items.map(it=>it.q.id),i:0,right:0};save();run(d,items,d.key)};
    bs[0].onclick=()=>{if(live){const items=se.ids.map(id=>byId[id]).filter(Boolean);if(items.length===se.ids.length)return run(d,items,d.key)}fresh()};
    if(live)bs[1].onclick=fresh;
    bs[bs.length-1].onclick=()=>run(d,s.bad,null);
    app.append(el);
  });
  const rs=$(`<div class="deck"><div class="i"><b>풀이 기록 지우기</b><small>정답 기록과 이어 풀기 위치를 지워. 적어둔 메모는 남아.</small></div><div class="b"><button class="btn g">지우기</button></div></div>`);
  let armed=false;rs.querySelector('button').onclick=(e)=>{if(!armed){armed=true;e.target.textContent='한 번 더 누르면 지움';return}ST.rec={};ST.sess={};save();home()};
  app.append(rs);
}
function notesView(){
  view='notes';app.innerHTML='';window.scrollTo(0,0);
  const top=$(`<div class="top"><button class="btn g">처음으로</button><div class="t">내가 적은 틀린 이유</div></div>`);top.querySelector('button').onclick=home;app.append(top);
  const list=Object.entries(ST.notes).filter(([,n])=>n.t&&n.t.trim()).sort((a,b)=>b[1].at-a[1].at);
  if(!list.length){app.append($('<p class="sub">아직 메모가 없어. 문제를 풀고 해설 아래 칸에 틀린 이유를 적으면 여기에 모여.</p>'));return}
  const text=list.map(([id,n])=>`[${id}] (${n.ok?'맞힘':'틀림'}) ${n.t.trim()}`).join('\n');
  const cp=$('<div class="nav"><button class="btn">전체 복사</button></div>');
  cp.querySelector('button').onclick=async(e)=>{try{await navigator.clipboard.writeText(text);e.target.textContent='복사됨'}catch(err){const ta=$('<textarea readonly></textarea>');ta.value=text;ta.style.cssText='width:100%;min-height:160px';cp.after(ta);ta.select();e.target.textContent='아래 글을 길게 눌러 복사'}};
  app.append(cp);
  list.forEach(([id,n])=>{const el=$('<div class="note"><b></b><p></p></div>');el.querySelector('b').textContent=id+(n.ok?' · 맞힘':' · 틀림');el.querySelector('p').textContent=n.t;app.append(el)});
}
function run(deck,items,sessKey){
  view='quiz';
  let i=sessKey&&ST.sess[sessKey]?ST.sess[sessKey].i:0,right=sessKey&&ST.sess[sessKey]?ST.sess[sessKey].right:0,tab=0,curSet=null,ko=false;
  const keep=()=>{if(sessKey){ST.sess[sessKey].i=i;ST.sess[sessKey].right=right;save()}};
  function show(){
    app.innerHTML='';
    if(i>=items.length){
      if(sessKey){delete ST.sess[sessKey];save()}
      app.append($(`<div class="q done"><div class="n">${right} / ${items.length}</div><p class="sub">${deck.title}</p><div class="nav"><button class="btn">처음으로</button></div></div>`));
      app.querySelector('.done button').onclick=home;window.scrollTo(0,0);return}
    const it=items[i],q=it.q,s=it.set;
    const top=$(`<div class="top"><button class="btn g">나가기</button><div class="t">${deck.title} · ${i+1}/${items.length}</div></div>`);
    top.querySelector('button').onclick=home;app.append(top);
    let ps=null,tb=null;
    const paint=()=>{if(!ps)return;const t=s.tabs[tab];ps.innerHTML=(ko&&t.k)?t.k:t.h;ps.classList.toggle('ko',!!(ko&&t.k))};
    if(s){
      if(s!==curSet){curSet=s;tab=0;ko=false}
      if(s.tabs.length>1){tb=$('<div class="tabs" role="tablist"></div>');s.tabs.forEach((t,k)=>{const b=$(`<button role="tab" aria-selected="${k===tab}">${k+1}. ${t.l}</button>`);b.onclick=()=>{tab=k;paint();ps.scrollTop=0;tb.querySelectorAll('button').forEach((x,m)=>x.setAttribute('aria-selected',m===k))};tb.append(b)});app.append(tb)}
      ps=$('<div class="pass"></div>');paint();app.append(ps);
    }
    const card=$(`<div class="q"><div class="m">${q.hit||(!s&&q.w)?'<span class="star">★ 틀렸던 문제</span>':''}<span>${q.id}${q.t?' · '+q.t:''}</span></div><p class="s"></p><div class="opts"></div></div>`);
    card.querySelector('.s').innerHTML=q.s;
    const box=card.querySelector('.opts');
    const isP7=!!(s&&/^[A-Z?]|What|Why|Who|How|Where|When|Which|In which|According|At /.test(q.s)&&!/^빈칸/.test(q.s));
    const types=isP7?['명확','불명확','연계','문장삽입']:['문법','전·접·부','어휘','문장삽입'];
    const pre=$(`<div class="pre"><small>${isP7?'① 문제만 먼저 보고 유형 판정 → 명확이면 주관식 답 먼저':'① 문장 읽기 전에 선지 생김새로 유형 판정'} · ② 확신도</small><div class="row t"></div><div class="row c"></div></div>`);
    let pick={t:null,c:null};const t0=Date.now();
    const chips=(row,arr,key)=>arr.forEach(v=>{const b=$(`<button class="chip" aria-pressed="false">${v}</button>`);b.onclick=()=>{pick[key]=v;row.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));unlock()};row.append(b)});
    chips(pre.querySelector('.t'),types,'t');chips(pre.querySelector('.c'),['O 확신','△ 고민','? 모름'],'c');
    const unlock=()=>box.classList.toggle('lock',!(pick.t&&pick.c));
    card.querySelector('.s').before(pre);box.classList.add('lock');
    // 필기 (iPad·Apple Pencil): 카드 위에 그리기
    const tools=$('<div class="tools"><button class="chip" aria-pressed="false">✎ 필기</button><button class="chip" hidden>지우개</button><button class="chip" hidden>전부 지움</button></div>');
    const cv=document.createElement('canvas');cv.hidden=true;card.classList.add('pad');card.append(cv);
    const nk='ink-'+q.id;let erase=false,drawing=false,ctx=null;
    const fit=()=>{const r=card.getBoundingClientRect(),d=window.devicePixelRatio||1;const old=cv.width?cv.toDataURL():null;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';
      const src=old||(()=>{try{return localStorage.getItem(nk)}catch(e){return null}})();if(src){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=src}};
    const [tb1,tb2,tb3]=tools.querySelectorAll('button');
    tb1.onclick=()=>{const on=cv.hidden;cv.hidden=!on;tb1.setAttribute('aria-pressed',on);tb2.hidden=tb3.hidden=!on;if(on)fit()};
    tb2.onclick=()=>{erase=!erase;tb2.setAttribute('aria-pressed',erase)};
    tb3.onclick=()=>{ctx&&ctx.clearRect(0,0,cv.width,cv.height);try{localStorage.removeItem(nk)}catch(e){}};
    cv.onpointerdown=e=>{if(e.pointerType==='touch'&&e.width>20)return;drawing=true;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};
    cv.onpointermove=e=>{if(!drawing)return;const r=cv.getBoundingClientRect();ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.lineWidth=erase?18:(1.2+2.2*(e.pressure||.5));ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--no')||'#c00';ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};
    cv.onpointerup=cv.onpointercancel=()=>{if(!drawing)return;drawing=false;try{localStorage.setItem(nk,cv.toDataURL())}catch(e){}};
    pre.before(tools);
    q.o.forEach((o,k)=>{const b=$(`<button><span class="l">${'ABCD'[k]}</span><span></span></button>`);b.lastElementChild.innerHTML=o;
      b.onclick=()=>{
        if(!(pick.t&&pick.c)){pre.querySelector('small').classList.add('warn');pre.scrollIntoView({block:'nearest'});return}
        const ok=k===q.a;if(ok)right++;const sec=Math.round((Date.now()-t0)/1000);
        ST.hab=ST.hab||{};ST.hab[q.id]={t:pick.t,c:pick.c[0],sec,ok};
        const r=ST.rec[q.id]||[0,0,0];r[ok?0:1]++;r[2]=ok?1:0;ST.rec[q.id]=r;
        if(sessKey){ST.sess[sessKey].i=i+1;ST.sess[sessKey].right=right}save();
        box.querySelectorAll('button').forEach((x,m)=>{x.disabled=true;if(m===q.a)x.classList.add('ok');else if(m===k)x.classList.add('no')});
        const ex=$(`<div class="ex"><div class="r ${ok?'ok':'no'}">${ok?'정답':'오답'} · 정답 ${'ABCD'[q.a]}</div><div class="n"></div></div>`);
        ex.querySelector('.n').textContent=q.n;
        const tip=[];tip.push(`내 판정: ${pick.t} · 확신 ${pick.c} · ${sec}초`);
        if(!ok&&pick.c[0]==='O')tip.push('확신했는데 틀림 → 함정에 걸린 문제. ④ 소거를 꼭 읽고 이유를 적어.');
        if(!ok&&sec<15)tip.push('15초 안에 골랐어. 시간은 남으니 근거 줄을 찾고 고르기.');
        if(ok&&pick.c[0]!=='O')tip.push('맞혔지만 확신이 없었어 → 운일 수 있으니 근거를 확인.');
        const hb=$('<div class="w"></div>');hb.textContent=tip.join('\n');hb.style.whiteSpace='pre-line';ex.querySelector('.n').before(hb);
        if(q.k){const kk=$('<div class="k"></div>');kk.textContent='해석: '+q.k;ex.append(kk)}
        if(q.w){const w=$('<div class="w"></div>');w.textContent='예전에 틀린 이유: '+q.w;ex.append(w)}
        if(s&&s.tabs.some(t=>t.k)){const kb=$('<div class="nav"><button class="btn g">지문 해석 보기</button></div>');kb.querySelector('button').onclick=(e)=>{ko=!ko;paint();e.target.textContent=ko?'지문 원문 보기':'지문 해석 보기';ps.scrollIntoView({block:'nearest'})};ex.append(kb)}
        const nid='note-'+noteKey(q.id);
        const nt=$(`<div><label for="${nid}">내가 틀린 이유 (적으면 자동 저장)</label><textarea id="${nid}" placeholder="예: by를 수단으로 읽었다. 근거 줄을 안 찾고 골랐다."></textarea></div>`);
        const ta=nt.querySelector('textarea');ta.value=(ST.notes[q.id]&&ST.notes[q.id].t)||'';let tt=null;
        ta.oninput=()=>{ST.notes[q.id]={t:ta.value,at:Date.now(),ok};saveLocal();clearTimeout(tt);tt=setTimeout(()=>saveNote(q.id),900)};
        ta.onblur=()=>{if(ST.notes[q.id]){clearTimeout(tt);saveNote(q.id)}};
        ex.append(nt);
        const nv=$(`<div class="nav"><button class="btn">${i+1<items.length?'다음':'결과 보기'}</button></div>`);
        nv.querySelector('button').onclick=()=>{i++;keep();show()};ex.append(nv);
        card.append(ex);ex.scrollIntoView({block:'nearest',behavior:'smooth'});
      };box.append(b)});
    app.append(card);if(!s)window.scrollTo(0,0);
  }
  show();
}
home();
</script>
